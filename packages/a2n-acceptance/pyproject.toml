[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-acceptance"
version = "0.2.0b2"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "A2N 纯验收规则与声明模板"
requires-python = ">=3.11"
dependencies = ["a2n-kernel"]

[tool.setuptools.packages.find]
where = ["src"]
