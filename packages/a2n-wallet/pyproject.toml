[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-wallet"
version = "0.1.0"
description = "A2N 钱包：提现申请、风控与积分销毁"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "a2n-store", "a2n-ledger", "a2n-custodian"]

[tool.setuptools.packages.find]
where = ["src"]
