[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-dispatch"
version = "0.1.0"
description = "A2N 调度：候选集、排序策略与派单前校验"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "a2n-store", "a2n-registry"]

[tool.setuptools.packages.find]
where = ["src"]
