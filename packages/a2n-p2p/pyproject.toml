[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-p2p"
version = "0.1.0"
description = "A2N 网络层（L0）：DID 身份、对等发现、gossip 传播"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "cryptography"]

[tool.setuptools.packages.find]
where = ["src"]
