[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-p2p"
version = "0.2.0b2"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "A2N 网络层（L0）：DID 身份、对等发现、gossip 传播"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "cryptography"]

[tool.setuptools.packages.find]
where = ["src"]
