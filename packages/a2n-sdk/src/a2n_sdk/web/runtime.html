<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="rt.title"></title>
<style>
:root{--ink:#153735;--muted:#71817e;--line:#dce8e2;--green:#116656;--green2:#e8f4ef;--bg:#f3f7f5;--bad:#a34537;--warn:#94661d;--shadow:0 14px 40px rgba(27,65,58,.07)}*{box-sizing:border-box}
body{margin:0;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:9px 14px;cursor:pointer;color:#fff;background:var(--green);font-size:12px;font-weight:650}button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:wait}.ghost{background:var(--green2);color:var(--green)}.danger{background:#fff0ed;color:var(--bad)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head{max-width:1220px;margin:auto;padding:16px 24px;display:flex;align-items:center;gap:15px}.mark{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:#173f39;color:#fff;font-weight:850}.brand{font-size:18px;font-weight:850;letter-spacing:.5px}.sub,.muted{color:var(--muted);font-size:12px}.grow{flex:1}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;background:var(--green2);color:#276d5d;font-size:11px}.badge.warn{background:#fff6df;color:var(--warn)}
/* 语言选择器：只有一份译文时整体隐藏（点了没反应的选择器比没有更糟）。 */
.langwrap[hidden]{display:none}.langwrap select{width:auto;padding:5px 9px;font-size:12px;border-radius:8px;color:var(--muted)}
nav{max-width:1220px;margin:auto;padding:0 24px;display:flex;gap:7px}.navbtn{background:transparent;color:var(--muted);border-radius:0;padding:11px 16px;border-bottom:2px solid transparent}.navbtn.on{color:var(--green);border-color:var(--green)}main{max-width:1220px;margin:auto;padding:32px 24px 70px}.page{display:none}.page.on{display:block}.intro{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--green);font-weight:750}.intro h1{font-size:30px;letter-spacing:-1px;margin:3px 0 5px}.intro p{margin:0;color:var(--muted);max-width:760px}
.panel,.agent,.stat{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.panel{border-radius:15px;padding:21px;margin:16px 0}.panel h2{font-size:17px;margin:0}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.stat{padding:15px 16px;border-radius:11px}.stat strong{display:block;font-size:21px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.agent{border-radius:12px;padding:16px;min-width:0}.agent h3{font-size:15px;margin:0}.agent p{margin:7px 0}.agent code{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.facts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.fact{background:#f4f8f6;color:#46625d;border-radius:6px;padding:2px 7px;font-size:11px}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}.section-head{display:flex;align-items:center;gap:10px;margin:27px 0 10px}.section-head h2{margin:0;font-size:18px}.section-head .count{font-size:11px;background:#e8efec;padding:2px 7px;border-radius:99px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px;background:rgba(255,255,255,.55)}
input,select,textarea{width:100%;border:1px solid #c9d9d2;border-radius:8px;padding:9px 11px;color:var(--ink);background:#fff;min-width:0}textarea{font:12px/1.55 ui-monospace,Consolas,monospace;min-height:105px;resize:vertical}label{display:block;font-size:12px;margin:11px 0 4px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}details{margin:14px 0}summary{cursor:pointer;font-weight:700}.hint{padding:11px 12px;background:#f4f8f6;border-radius:8px;color:var(--muted);font-size:12px}.spark{height:22px;display:flex;align-items:end;gap:2px;margin:8px 0}.spark i{display:block;width:4px;min-height:2px;border-radius:2px;background:#3d927d}.spark i.down{background:#d17a66}.peerlist{display:grid;gap:7px}.peer{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px}.peer code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:550}.error{color:var(--bad)}#notice{min-height:26px;margin:8px 0}pre,code{font:12px/1.65 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#f0f5f2;border-radius:9px;padding:15px;max-height:430px;overflow:auto}dialog{border:1px solid var(--line);border-radius:15px;width:min(820px,94vw);padding:22px;color:var(--ink)}dialog::backdrop{background:#173c3855}.hidden{display:none!important}
/* ---------- 发现页：左维度栏 + 右结果（多维度筛选） ----------
   维度只决定"怎么把候选分组给人看"，不改任何事实：能力 id / 名称 / 价格
   全来自卡本身。取数失败不翻空态 —— 空态与"没查到"是两件事。 */
.disc-body{display:grid;grid-template-columns:214px minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.facets{border:1px solid var(--line);border-radius:12px;padding:3px 13px;background:#fbfdfc;position:sticky;top:80px}
.facet{padding:11px 0;border-bottom:1px solid var(--line)}.facet:last-child{border-bottom:0}
.facet h4{margin:0 0 7px;font-size:11.5px;letter-spacing:.4px;color:var(--muted);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid transparent;background:#eef4f1;color:#3c5b55;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;line-height:1.5}
.opt:hover{background:#e2efea}
.opt.on{background:var(--green2);border-color:var(--green);color:var(--green);font-weight:700}
.opt{max-width:100%;overflow-wrap:anywhere}.facet-more summary{font-size:12px;color:var(--green)}
.opt .n{opacity:.6;margin-left:4px;font-size:10px}
.disc-tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.disc-tools select{width:auto;padding:6px 9px}
.vswitch{display:inline-flex;border:1px solid #c9d9d2;border-radius:8px;overflow:hidden}
.vswitch button{background:#fff;color:var(--muted);border-radius:0;padding:6px 12px;font-weight:600}
.vswitch button.on{background:var(--green2);color:var(--green)}
.resmeta{color:var(--muted);font-size:12px;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--green2);color:#276d5d;border-radius:99px;padding:2px 4px 2px 9px;font-size:11px}
.chip{max-width:100%}.chip>span{min-width:0;overflow-wrap:anywhere}.chip button{background:transparent;color:#276d5d;border-radius:99px;padding:1px 5px;font-size:12px;font-weight:700}
table.tbl{min-width:660px}
table.tbl th,table.tbl td{white-space:normal;vertical-align:top}
table.tbl .nm{font-weight:700}
table.tbl .ds{color:var(--muted);max-width:340px}
/* 对比视图 = 紧凑列表 + 一列「历史信誉 / 质量证据」。证据只呈现卡上真有的；本控制台
   的网络候选卡通常不带 evidence，这时**如实写「暂无」** —— 不替供给方编一个分数。
   与演示版对比列同一列组（信誉 / 质量证据 / 评价），无数据就照实说无。 */
table.tbl.cmp-tbl{min-width:960px}
table.tbl.cmp-tbl th,table.tbl.cmp-tbl td{white-space:normal;vertical-align:top}
table.tbl.cmp-tbl .cmp{font-size:11px;color:#5d766d;line-height:1.9;min-width:150px}
table.tbl.cmp-tbl .cmp>div{white-space:nowrap}
/* 详情里的「真实交付样品」：数据来自供给方公开面。同源可直接内联读；跨源被浏览器
   同源策略挡住时如实说明并给新窗口入口，不假装读到了、也不编地址。 */
.detail-extra{margin-top:12px}
.samples-live{border-top:1px dashed var(--line);padding-top:10px}
.cmp-loading,.cmp-fail{background:#f0f5f2;border-radius:9px;padding:12px;color:var(--muted);white-space:pre-wrap;max-height:300px;overflow:auto;margin:6px 0}
.cmp-fail{color:var(--bad);background:#fff0ed}
.cmp-list{margin:6px 0;max-height:340px;overflow:auto}
/* 写反馈表单：一行一维，留空 = 不评这一维（不评不等于差评）。 */
.fbrow{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:13px}
.fbrow>span{min-width:170px;color:var(--ink)}
.fbrow select,.fbrow textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);background:#fff}
.fbrow textarea{flex:1;resize:vertical}
@media(max-width:720px){.head,nav,main{padding-left:15px;padding-right:15px}
/* 窄屏头部多了语言选择器后一行放不下：允许换行，且按钮/徽章不拆字（「刷/新」分两行最难看）。 */
.head{flex-wrap:wrap;row-gap:6px}.head button,.head .badge{white-space:nowrap}#langWrap{margin-left:auto}
.intro{align-items:start;flex-direction:column}.intro h1{font-size:25px}.stats,.grid,.formgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.peer{grid-template-columns:minmax(0,1fr) auto}.peer .spark{grid-column:1/-1}.search{grid-template-columns:1fr}.navbtn{padding:10px 11px}.panel{padding:17px}.disc-body{grid-template-columns:1fr}.facets{position:static}}
/* ---------- 供给详情：试用进度 + 交付样品（VISION §1.2 #12「样品即履历」） ----------
   样品是**真实交付过的样子**，不是卖方挑的宣传稿：删不掉、锚定当时的 Agent 版本、
   失败不占名额。这里只如实呈现事实计数与内容，不替供给方下质量结论。 */
.trial{margin:10px 0 2px}.tprog{height:6px;border-radius:99px;background:#e8efec;overflow:hidden}.tprog i{display:block;height:100%;background:linear-gradient(90deg,#3d927d,#116656)}.tprog.full i{background:#8a9a96}
.samples{margin-top:11px;border-top:1px dashed var(--line);padding-top:8px}.samples summary{font-size:11.5px;color:var(--muted);font-weight:600}
.sample{border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-top:8px;background:#fbfdfc}.sample .sreq{margin:5px 0;font-weight:650}.sample pre{max-height:190px;margin:6px 0 5px;background:#f3f7f5}
</style>
</head>
<body>
<header>
  <div class="head"><div class="mark">A</div><div><div class="brand">A2N</div><div class="sub" data-i18n="rt.head.tagline"></div></div><div class="grow"></div><span id="langWrap" class="langwrap" hidden><select id="lang" data-i18n-aria-label="rt.head.lang_label"></select></span><span id="connection" class="badge" data-i18n="rt.head.connecting"></span><button class="ghost" id="refresh" data-i18n="rt.head.refresh"></button></div>
  <nav><button class="navbtn on" data-page="find" data-i18n="rt.nav.find"></button><button class="navbtn" data-page="sell" data-i18n="rt.nav.sell"></button><button class="navbtn" data-page="account" data-i18n="rt.nav.account"></button></nav>
</header>
<main>
<div id="notice" role="status" aria-live="polite"></div>

<section id="find" class="page on">
  <div class="intro"><div><div class="eyebrow">DISCOVER / USE / SETTLE</div><h1 data-i18n="rt.find.hero_title"></h1><p data-i18n="rt.find.hero_intro"></p></div><span class="badge" data-i18n="rt.find.hero_badge"></span></div>
  <div class="stats"><div class="stat"><span class="sub" data-i18n="rt.find.stat_peers"></span><strong id="peerCount">0</strong></div><div class="stat"><span class="sub" data-i18n="rt.find.stat_rtt"></span><strong id="peerRtt">—</strong></div><div class="stat"><span class="sub" data-i18n="rt.find.stat_use"></span><strong id="useCount">0</strong></div><div class="stat"><span class="sub" data-i18n="rt.find.stat_local_rtt"></span><strong id="localRtt">—</strong></div></div>
  <section class="panel"><div class="bar"><div><h2 data-i18n="rt.find.discover_heading"></h2><div class="sub" id="discoveryState" data-i18n="rt.find.discovery_state"></div></div><span class="grow"></span><button class="ghost" id="browseAll" data-i18n="rt.find.browse_all"></button></div><form id="searchform" class="search" style="margin-top:12px"><input id="skill" required data-i18n-placeholder="rt.find.skill_placeholder" autocomplete="off"><button data-i18n="rt.find.search_btn"></button></form><div id="searchErrors" class="sub"></div><div class="panel" id="coordSession" hidden><p class="sub" id="coordProgress"></p><button class="ghost" id="coordPause" data-i18n="rt.find.pause"></button> <button id="coordContinue" data-i18n="rt.find.continue"></button></div>
    <div class="disc-body"><aside class="facets" id="facets"></aside><div>
      <div class="disc-tools"><input id="discQ" data-i18n-placeholder="rt.find.q_placeholder" autocomplete="off" style="width:230px"><select id="discSort" data-i18n-aria-label="rt.find.sort_label"><option value="default" data-i18n="rt.find.sort_default"></option><option value="name" data-i18n="rt.find.sort_name"></option><option value="price" data-i18n="rt.find.sort_price"></option></select><div class="vswitch" role="group" data-i18n-aria-label="rt.find.view_label"><button type="button" id="vwCards" class="on" data-i18n="rt.find.view_cards"></button><button type="button" id="vwList" data-i18n="rt.find.view_list"></button><button type="button" id="vwCompare" data-i18n="rt.find.view_compare"></button></div><span class="grow"></span><button type="button" class="ghost" id="discReset" data-i18n="rt.find.reset"></button></div>
      <div class="resmeta" id="resmeta"></div>
      <div id="results" class="grid"><div class="empty" data-i18n="rt.find.empty"></div></div>
    </div></div>
  </section>
  <section class="panel" id="marketPanel"><div class="bar"><div><h2 data-i18n="rt.find.market_heading"></h2><div class="sub" data-i18n="rt.find.market_intro"></div></div></div><div id="marketBody"><div class="empty" data-i18n="rt.find.market_empty"></div></div></section>
  <div class="section-head"><h2 data-i18n="rt.find.use_heading"></h2><span class="count" id="useBadge">0</span><span class="grow"></span><button class="ghost" data-open="import" data-i18n="rt.find.paste_card"></button></div>
  <div id="projections" class="grid"></div>
  <details class="panel" id="import"><summary data-i18n="rt.find.import_heading"></summary><form id="importform"><label for="importCard" data-i18n="rt.find.import_card_label"></label><textarea id="importCard" required placeholder='{"name":"...","url":"https://...","skills":[...]}'></textarea><label for="importAccount" data-i18n="rt.find.import_account_label"></label><select id="importAccount" class="accounts"></select><p class="hint" data-i18n="rt.find.import_hint"></p><button data-i18n="rt.find.import_btn"></button></form></details>
  <div class="section-head"><h2 data-i18n="rt.find.calls_heading"></h2></div><div class="panel table-wrap" id="consumerCalls"></div>
</section>

<section id="sell" class="page">
  <div class="intro"><div><div class="eyebrow">MOUNT / PROJECT / DELIVER</div><h1 data-i18n="rt.sell.hero_title"></h1><p><span data-i18n="rt.sell.hero_p1"></span><b data-i18n="rt.sell.hero_desc"></b><span data-i18n="rt.sell.hero_and"></span><b data-i18n="rt.sell.hero_case"></b><span data-i18n="rt.sell.hero_p2"></span></p></div><span class="badge" data-i18n="rt.sell.hero_badge"></span></div>
  <div class="section-head"><h2 data-i18n="rt.sell.list_heading"></h2><span class="count" id="sellBadge">0</span><span class="count" id="trialBadge" data-i18n-title="rt.sell.trial_badge_title" data-i18n="rt.sell.trial_badge"></span><span class="grow"></span><button data-open="mount" data-i18n="rt.sell.mount_btn"></button></div>
  <div id="bindings" class="grid"></div>
  <details class="panel" id="mount"><summary data-i18n="rt.sell.mount_heading"></summary><form id="mountform">
    <label for="sourceCard" data-i18n="rt.sell.source_card_label"></label><textarea id="sourceCard" data-i18n-placeholder="rt.sell.source_card_placeholder"></textarea>
    <div class="formgrid"><div><label for="agentName" data-i18n="rt.sell.name_label"></label><input id="agentName" data-i18n-placeholder="rt.sell.name_placeholder"></div><div><label for="agentSkill" data-i18n="rt.sell.skill_label"></label><input id="agentSkill" placeholder="invoice-ocr"></div></div>
    <p class="hint" id="sampleRule"><span data-i18n="rt.sell.sample_rule_a"></span><strong data-i18n="rt.sell.sample_rule_b"></strong><span data-i18n="rt.sell.sample_rule_c"></span></p>
    <label for="agentDescription" data-i18n="rt.sell.description_label"></label><input id="agentDescription" data-i18n-placeholder="rt.sell.description_placeholder">
    <label for="endpoint" data-i18n="rt.sell.endpoint_label"></label><input id="endpoint" type="url" data-i18n-placeholder="rt.sell.endpoint_placeholder">
    <div class="formgrid"><div><label for="protocol" data-i18n="rt.sell.protocol_label"></label><select id="protocol"><option value="a2a">A2A</option><option value="json" data-i18n="rt.sell.protocol_json"></option></select></div><div><label for="bindingAccount" data-i18n="rt.sell.account_label"></label><select id="bindingAccount" class="accounts"></select></div></div>
    <label class="bar" style="justify-content:flex-start"><input id="publishNow" type="checkbox" checked style="width:auto"> <span data-i18n="rt.sell.publish_now"></span></label>
    <p class="hint" id="publishHint" data-i18n="rt.sell.publish_hint"></p><button data-i18n="rt.sell.save_btn"></button>
  </form></details>
  <div class="section-head"><h2 data-i18n="rt.sell.calls_heading"></h2></div><div class="panel table-wrap" id="providerCalls"></div>
</section>

<section id="account" class="page">
  <div class="intro"><div><div class="eyebrow">LOCAL CONTROL / OBSERVE</div><h1 data-i18n="rt.acct.hero_title"></h1><p data-i18n="rt.acct.hero_intro"></p></div><span class="badge" id="nodeMode" data-i18n="rt.acct.node_mode"></span></div>
  <section class="panel"><div class="bar"><h2 data-i18n="rt.acct.accounts_heading"></h2><span class="grow"></span><span class="sub" data-i18n="rt.acct.accounts_note"></span></div><div id="accountsList"></div><details><summary data-i18n="rt.acct.accounts_edit"></summary><form id="accountform"><div class="formgrid"><div><label for="accountId" data-i18n="rt.acct.account_id_label"></label><input id="accountId" required placeholder="video-cloud"></div><div><label for="accountLabel" data-i18n="rt.acct.account_label_label"></label><input id="accountLabel" required data-i18n-placeholder="rt.acct.account_label_placeholder"></div></div><label for="headerName" data-i18n="rt.acct.header_name_label"></label><input id="headerName" value="Authorization" required><label for="headerValue" data-i18n="rt.acct.header_value_label"></label><input id="headerValue" type="password" autocomplete="new-password" placeholder="Bearer …" required><p class="hint" data-i18n="rt.acct.credential_hint"></p><button data-i18n="rt.acct.save_btn"></button></form></details></section>
  <section class="panel"><div class="bar"><div><h2 data-i18n="rt.acct.settle_heading"></h2><div class="sub" data-i18n="rt.acct.settle_note"></div></div><span class="grow"></span><span class="badge" id="settleCount">0</span></div><div id="settlements"></div></section>
  <section class="panel"><div class="bar"><div><h2 data-i18n="rt.acct.fb_heading"></h2><div class="sub"><span data-i18n="rt.acct.fb_note_a"></span><b data-i18n="rt.acct.fb_note_b"></b><span data-i18n="rt.acct.fb_note_c"></span></div></div><span class="grow"></span><button class="ghost" data-fb-summary data-i18n="rt.acct.fb_summary"></button><span class="badge" id="feedbackCount">0</span></div><div id="feedbackBox"></div></section>
  <section class="panel"><div class="bar"><div><h2 data-i18n="rt.acct.dispute_heading"></h2><div class="sub" data-i18n="rt.acct.dispute_note"></div></div><span class="grow"></span><span class="badge" id="disputeCount">0</span></div><div id="disputesBox"></div></section>
  <section class="panel"><div class="bar"><div><h2 data-i18n="rt.acct.public_heading"></h2><div class="sub" data-i18n="rt.acct.public_note"></div></div></div><p class="sub" id="publicState"></p><div id="publicSwitches"></div></section>
  <section class="panel"><div class="bar"><div><h2 data-i18n="rt.acct.net_heading"></h2><div class="sub" id="p2pState" data-i18n="rt.acct.net_state"></div></div></div><div class="stats"><div class="stat"><span class="sub" data-i18n="rt.acct.net_packets"></span><strong id="packets">0 / 0</strong></div><div class="stat"><span class="sub" data-i18n="rt.acct.net_dropped"></span><strong id="dropped">0</strong></div><div class="stat"><span class="sub" data-i18n="rt.acct.net_advertise"></span><strong id="advertise" data-i18n="rt.acct.net_off"></strong></div><div class="stat"><span class="sub" data-i18n="rt.acct.net_roots"></span><strong id="publicRoots" data-i18n="rt.acct.net_unset"></strong></div></div><div id="peers" class="peerlist"></div></section>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 静态骨架的文案只留 data-i18n 键，值从消息表取（zh-CN 是默认语言，值逐字保留）。
   属性用 data-i18n-<attr>：键查不到就保持原样，不把键名显示给用户。 */
const I18N_ATTRS=[['placeholder','data-i18n-placeholder'],['title','data-i18n-title'],['aria-label','data-i18n-aria-label'],['alt','data-i18n-alt']];
function localize(root){const scope=root||document;
  scope.querySelectorAll('[data-i18n]').forEach(el=>{const v=I18N.text(el.getAttribute('data-i18n'));if(v!==null)el.textContent=v});
  I18N_ATTRS.forEach(pair=>scope.querySelectorAll('['+pair[1]+']').forEach(el=>{const v=I18N.text(el.getAttribute(pair[1]));if(v!==null)el.setAttribute(pair[0],v)}))}
localize();
/* ---------- 语言切换 ----------
   只有「至少有一条译文」的语言才进选择器（I18N.locales() 的 ready）：点了界面
   一个字都不变的选择器，比没有选择器更糟。补上 en 表第一条译文，选择器自动出现。
   切换后**重渲染**：localize() 补骨架静态文案与属性，applyDisc()/render() 按最近
   一次快照重画全部面板。已弹出的对话框与已显示的提示是当时的字符串，不追溯改写 ——
   下次打开/下次操作即新语言（宁可这样，也不把整页 reload 掉、丢掉正在填的表单）。 */
function langChoices(){return I18N.locales().filter(l=>l.ready)}
function renderLangSwitch(){const wrap=$('#langWrap'),sel=$('#lang');if(!wrap||!sel)return;
  const list=langChoices();
  if(list.length<2){wrap.hidden=true;sel.innerHTML='';return}
  wrap.hidden=false;
  sel.innerHTML=list.map(l=>`<option value="${esc(l.id)}"${l.id===I18N.locale()?' selected':''}>${esc(l.label)}</option>`).join('')}
function switchLocale(name){if(!I18N.setLocale(name))return false;localize();renderLangSwitch();applyDisc();render();return true}
let snapshot={bindings:[],projections:[],accounts:[],recent_calls:[],settlements:[],disputes:[],dispute_counts:{},feedback:[],feedback_counts:{},trials:{},trial_counts:{},network:[]}, found=[], refreshing=false;
function notice(text,bad=false){$('#notice').textContent=text||'';$('#notice').className=bad?'error':'';}
async function request(path,body,headers={}){const options={method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...headers},signal:AbortSignal.timeout(35000)};if(body!==undefined)options.body=JSON.stringify(body);const r=await fetch(path,options);
if(r.headers.get('Content-Type')?.startsWith('text/event-stream')){const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',result=null,received=0;while(true){const part=await reader.read();if(part.done)break;received+=part.value.length;if(received>16777216){await reader.cancel();throw Error(I18N.t('rt.err.too_large'))}buffer+=decoder.decode(part.value,{stream:true});let end;while((end=buffer.indexOf('\n\n'))>=0){const record=buffer.slice(0,end);buffer=buffer.slice(end+2);for(const line of record.split('\n'))if(line.startsWith('data:')){const frame=JSON.parse(line.slice(5));if(frame.event==='progress')document.dispatchEvent(new CustomEvent('a2n:progress',{detail:{path,delta:frame.delta}}));else if(frame.event==='result'){if(frame.status>=400)throw Error(I18N.errorText(frame.data?.error||I18N.t('rt.err.result_pending')));result=frame.data}}}}if(result===null)throw Error(I18N.t('rt.err.no_result'));return result;}
const raw=await r.text();let d;try{d=raw?JSON.parse(raw):null}catch(_){d={error:raw}}if(!r.ok)throw Error(I18N.errorText((d&&d.error)||I18N.t('rt.err.request_failed')));return d;}
function show(title,value){$('#detailTitle').textContent=title;$('#detailBody').textContent=typeof value==='string'?value:JSON.stringify(value,null,2);const x=$('#detailExtra');if(x)x.innerHTML='';$('#detail').showModal();}
function skills(card){return (card.skills||[]).map(s=>typeof s==='string'?s:(s.name||s.id)).filter(Boolean)}
const CUR_EXP={CNY:2,USD:2,EUR:2,HKD:2,JPY:0,USDC:6},CUR_SYM={CNY:'¥',USD:'$',EUR:'€',HKD:'HK$',JPY:'¥'};
function money(amount,currency){const cur=String(currency||'CNY').toUpperCase(),exp=CUR_EXP[cur]??2,value=Number(amount||0)/10**exp;let shown=value.toFixed(exp);if(shown.includes('.'))shown=shown.replace(/0+$/,'').replace(/\.$/,'');if(exp===2&&!shown.includes('.'))shown+='.00';else if(exp===2&&shown.split('.')[1].length===1)shown+='0';return CUR_SYM[cur]?CUR_SYM[cur]+shown:`${shown} ${cur}`}
function price(card){const ext=card['x-a2n']||{},book=ext.price_book||card.price_book||{};for(const byCurrency of Object.values(book)){for(const [currency,rule] of Object.entries(byCurrency||{})){const d=(rule.dimensions||[])[0];if(d)return `${money(d.amount,currency)}/${d.key||I18N.t('rt.unit.per')}`}}return I18N.t('price.unpriced');}
function pricesOf(card){const ext=card['x-a2n']||{},book=ext.price_book||card.price_book||{},out=[];for(const byCurrency of Object.values(book)){for(const [currency,rule] of Object.entries(byCurrency||{})){for(const d of rule.dimensions||[]){const amount=Number(d.amount);if(Number.isFinite(amount)&&amount>=0)out.push({amount,currency,per:d.key||I18N.t('rt.unit.per')})}}}return out}
/* ---------- 发现页维度（多维度筛选） ----------
   维度只决定"怎么把候选分组给人看"，**不改任何事实**：能力 id / 名称 / 价格
   全来自卡本身。分类按**行业 / 交付物**分（不是"用了什么技术"）—— 买家找的是
   "谁能给我一份短视频成片包 / 一份经营报表"，不是"谁有 OCR 引擎"。未收录的能力
   一律落「其他」，新能力不会因为没登记就消失。想加分类：往 CATEGORY_ORDER 加名字，
   再把能力写进 SKILL_CATEGORY。 */
const SKILL_CATEGORY={'video-short':'video','video-script':'video','finance-report':'finance','legal-contract':'legal','game-design':'game','ecom-listing':'ecom','resume-polish':'hr','trip-plan':'travel','course-outline':'edu','menu-pricing':'food','ocr-pro':'doc','ocr-batch':'doc','doc-deskew':'doc'};
const CATEGORY_ORDER=['video','finance','legal','game','ecom','hr','travel','edu','food','doc'],CATEGORY_REST='other';
/* 分类的**值**是稳定 id（筛选状态里存的就是它），显示名走消息表 rt.cat.*。 */
function catLabel(id){return I18N.text('rt.cat.'+id)||id}
/* 浏览用的种子能力清单 = 本节点已知能力（自己的供给 / 待使用 / 邻居广播）优先，
   再补这份种子。节点**没有"列出全部"的接口**（/v1/discovery/search 必须给一个
   能力标识），所以"浏览"= 按清单逐条查再合并，界面上必须如实标注：这是已知能力
   清单，不是全网目录。任何没进清单的能力，仍可用搜索框直接查。 */
const BROWSE_SEED=Object.keys(SKILL_CATEGORY);
function skillCat(id){return SKILL_CATEGORY[id]||CATEGORY_REST}
function skillIds(card){return (card.skills||[]).map(s=>typeof s==='string'?s:(s.id||'')).filter(Boolean)}
function skillNames(card){return (card.skills||[]).map(s=>typeof s==='string'?s:(s.name||s.id||'')).filter(Boolean)}
function tagsOf(card){return (card.skills||[]).flatMap(s=>typeof s==='string'?[]:(s.tags||[]))}
function regionOf(card){const ext=card['x-a2n']||{};return (ext.deployment||{}).region||(card.compute||{}).region||''}
function acceptsOf(card){return window.A2NDiscovery.payments(card)}
/* 价格状态，三选一 —— 与页面其它地方同一条口径：
     free     = 有价目表且金额全为 0（供给方**明确声明**了零价）
     unpriced = 压根没有价目表。**未标价不自动等于免费**（纲领口径），既不算 free
                也不算 priced，界面上照实说「未标价」。
     priced   = 有价目表且至少一个金额 > 0
   多币种不换算、不相加：并排列出，不合成一个数（那等于替供给方定价）。 */
function priceState(card){const l=pricesOf(card);if(!l.length)return 'unpriced';return l.every(x=>!x.amount)?'free':'priced'}
function priceList(card){return pricesOf(card).map(x=>`${money(x.amount,x.currency)}/${x.per}`)}
function priceText(card){const s=priceState(card);if(s==='unpriced')return I18N.t('price.unpriced');if(s==='free')return I18N.t('rt.price.free_declared');return priceList(card).join(' · ')||I18N.t('price.unpriced')}
/* 自证身份 = 卡自带身份（投影 attested / origin self_attested）。没自证 ≠ 验过。 */
function attestedOf(card){const ext=card['x-a2n']||{};return !!((ext.projection||{}).attested||(ext.origin||{}).self_attested)}
function srcLabel(s){return I18N.text('source.'+s)||String(s||I18N.text('source.unknown'))}
function payLabel(a){return window.A2NDiscovery.label('pay',a)}
function paymentText(card){const supported=acceptsOf(card),modes=window.A2NDiscovery.points(card);return (supported.length?supported.map(payLabel).join(' · '):I18N.t('rt.pay_undeclared'))+(modes.length?'；'+modes.map(m=>window.A2NDiscovery.label('pointMode',m)).join(' / '):'')}
function cardKey(item){const c=item.card||{},pj=(c['x-a2n']||{}).projection||{},key=item.key||{};const did=key.provider_did||pj.node_did,sid=key.service_id||pj.service_id;return did&&sid?did+'|'+sid:'raw|'+JSON.stringify(c)}
/* ---------- 历史信誉 / 质量证据（对比视图那一列） ----------
   只呈现**供给方卡上真有的证据**：卡上带 evidence 就照实渲染，没有就如实写「暂无」。
   本控制台的网络候选卡通常不带 evidence（旧平台的信誉分不在卡上），这时**绝不替供给方
   编一个分数**。三条与演示版对比列同一口径：信誉 / 质量证据 / 评价。 */
function evidenceOf(card){const ev=(card||{}).evidence||((card||{})['x-a2n']||{}).evidence||{};
  const rep=ev.reputation!=null?Math.round(Number(ev.reputation)*100):null;
  const q=ev.quality||{},r=ev.ratings||{};
  const a=rep==null?`<div title="${esc(I18N.t('rt.ev.rep_none_title'))}">${esc(I18N.t('rt.ev.rep_none'))}</div>`:`<div>${esc(I18N.t('rt.ev.rep',{score:rep}))}</div>`;
  const b=q.measured?`<div>${esc(I18N.t('rt.ev.quality',{quality:String(q.quality),samples:String(q.samples||0)}))}</div>`:`<div title="${esc(I18N.t('rt.ev.quality_none_title'))}">${esc(I18N.t('rt.ev.quality_none'))}</div>`;
  const c=r.published?`<div>${esc(I18N.t('rt.ev.ratings',{score:String(r.score),raters:String(r.raters||0)}))}</div>`:`<div title="${esc(I18N.t('rt.ev.ratings_none_title'))}">${esc(I18N.t('rt.ev.ratings_none'))}</div>`;
  return a+b+c}
/* 从供给卡 url `{origin}/a2a/{sid}` 推出公开样品面地址 —— 与后端 _public_samples_url 同一口径。
   推不出来（没 url / 不是 A2N 卡路径）就返回空串，界面如实说「入口未知」，**不编地址**。 */
function sampleMedia(s){return (s.media_preview||[]).slice(0,2).filter(m=>m.mime_type==='image/png'&&typeof m.base64==='string'&&m.base64.length<=10924&&/^[A-Za-z0-9+/]*={0,2}$/.test(m.base64)).map(m=>`<img alt="${esc(I18N.t('rt.sample.thumb_alt'))}" loading="lazy" style="max-width:192px;max-height:192px" src="data:image/png;base64,${m.base64}">`).join('')+(s.document_previews||[]).slice(0,2).map(d=>`<details><summary>${esc(I18N.t('rt.sample.doc_excerpt'))}</summary><pre>${esc(String(d.text||'').slice(0,2048))}</pre></details>`).join('')}
function samplesUrlOf(card){const text=String((card||{}).url||'');if(!text.includes('/a2a/'))return '';
  const i=text.lastIndexOf('/a2a/'),origin=text.slice(0,i),sid=text.slice(i+5).replace(/^\/+|\/+$/g,'');
  return /^https?:\/\//.test(origin)&&sid?`${origin}/public/v1/samples?service_id=${sid}`:''}
const PRICE_LABEL={free:I18N.text('price.free'),unpriced:I18N.text('price.unpriced'),priced:I18N.text('price.priced')};
let pool=[];   // 本次到手的原始候选（未经筛选）；found 始终 = 筛选后的视图
const DISC_KEYS=['cat','skill','pay','pointMode','currency','chain','sample','provider','version','input','output','tags','region','price','source','verification'];
const disc={q:'',...Object.fromEntries(DISC_KEYS.map(k=>[k,''])),verified:false,sort:'default',view:'cards'};
function resetDisc(){DISC_KEYS.forEach(k=>disc[k]='');disc.verified=false;disc.q='';$('#discQ').value=''}
function discFiltered(skip=''){const q=disc.q.trim().toLowerCase(),selected=(k,values)=>k===skip||!window.A2NDiscovery.choices(disc[k]).length||window.A2NDiscovery.choices(disc[k]).some(v=>values.includes(v));return pool.filter(item=>{const c=item.card||{},ids=skillIds(c);
  if(!selected('cat',ids.length?ids.map(skillCat):[CATEGORY_REST]))return false;
  if(!selected('skill',ids))return false;
  if(!window.A2NDiscovery.matches(item,disc,skip))return false;
  if(!selected('region',[regionOf(c)||window.A2NDiscovery.UNKNOWN]))return false;
  if(!selected('price',[priceState(c)]))return false;
  if(skip!=='verified'&&disc.verified&&!attestedOf(c))return false;
  if(!selected('source',[String(item.source||I18N.t('rt.unknown'))]))return false;
  if(!q)return true;
  return [c.name||'',c.description||'',ids.join(' '),skillNames(c).join(' '),tagsOf(c).join(' '),regionOf(c)].join(' ').toLowerCase().includes(q)})}
// 排序用的 CNY 每次标价（最小单位）。不是 CNY 或未标价 → 一律排最后；
// **绝不拿别种币种换算成 CNY 来比** —— 汇率即价格，换算等于替供给方定价。
function cnyPrice(card){const hit=pricesOf(card).filter(x=>x.currency==='CNY');return hit.length?Math.min(...hit.map(x=>x.amount)):Infinity}
function discSorted(list){const arr=[...list],byName=(a,b)=>String((a.card||{}).name||'').localeCompare(String((b.card||{}).name||''),'zh');
  if(disc.sort==='name')arr.sort(byName);else if(disc.sort==='price')arr.sort((a,b)=>cnyPrice(a.card||{})-cnyPrice(b.card||{})||byName(a,b));return arr}
function browseSkills(){const known=new Set();
  (snapshot.bindings||[]).forEach(b=>(b.skills||[]).forEach(s=>known.add(String(s))));
  (snapshot.projections||[]).forEach(p=>(p.skills||[]).forEach(s=>known.add(String(s))));
  (((snapshot.discovery||{}).peers)||[]).forEach(p=>(p.skills||[]).forEach(s=>known.add(String(s))));
  BROWSE_SEED.forEach(s=>known.add(s));return [...known].filter(Boolean)}
function _facetGroup(title,rows){return `<div class="facet"><h4>${esc(title)}</h4><div class="opts">${rows.map(r=>`<button type="button" class="opt${r.on?' on':''}" aria-pressed="${r.on?'true':'false'}" data-facet="${r.k}" data-val="${esc(r.v)}" title="${esc(r.tip||r.label)}">${esc(r.label)}${r.n==null||r.n===0&&r.v===''?'':`<span class="n">${r.n}</span>`}</button>`).join('')}</div></div>`}
const DISC_FACETS=['cat','skill','pay','pointMode','sample','price','tags','currency','chain','provider','version','input','output','region','verification','source'];
/* 维度标题也是文案：值仍是维度键，标题查 rt.facet.*。 */
function facetTitle(key){return I18N.text('rt.facet.'+key)||key}
function facetValues(item,key){const c=item.card||{},ids=skillIds(c);if(key==='cat')return [...new Set(ids.length?ids.map(skillCat):[CATEGORY_REST])];
  if(key==='skill')return [...new Set(ids)];if(key==='price')return [priceState(c)];if(key==='region')return [regionOf(c)||window.A2NDiscovery.UNKNOWN];
  if(key==='source')return [String(item.source||I18N.t('rt.unknown'))];return window.A2NDiscovery.facts(item)[key]||[]}
function facetLabel(key,value){if(key==='cat')return catLabel(value);if(key==='skill')return value;if(key==='price')return PRICE_LABEL[value]||value;
  if(key==='source')return srcLabel(value);return window.A2NDiscovery.label(key,value)}
function renderFacets(){const box=$('#facets');if(!box)return;
  const expanded=box.querySelector('details')?.open;
  if(!pool.length){box.innerHTML=`<div class="facet"><h4>${esc(I18N.t('rt.facet.title_empty'))}</h4><p class="sub" style="margin:0">${esc(I18N.t('rt.facet.empty_hint'))}</p></div>`;return}
  const groups=DISC_FACETS.map(key=>{
    const values=new Set(pool.flatMap(item=>facetValues(item,key))),chosen=window.A2NDiscovery.choices(disc[key]);chosen.forEach(v=>values.add(v));
    if(key==='pay')['points','native','x402'].forEach(v=>values.add(v));
    if(key==='pointMode')Object.keys({EARN:1,DEBT:1,PAY:1}).forEach(v=>values.add(v));
    const counts=new Map();discFiltered(key).forEach(item=>facetValues(item,key).forEach(v=>counts.set(v,(counts.get(v)||0)+1)));
    const ordered=[...values].sort((a,b)=>a===window.A2NDiscovery.UNKNOWN?1:b===window.A2NDiscovery.UNKNOWN?-1:a.localeCompare(b,'zh'));
    return _facetGroup(facetTitle(key),[{k:key,v:'',label:I18N.t('rt.facet.all'),n:null,on:!chosen.length},...ordered.map(value=>{const label=facetLabel(key,value);return {k:key,v:value,label:key==='provider'&&label.length>25?label.slice(0,15)+'…'+label.slice(-6):label,tip:label,n:counts.get(value)||0,on:chosen.includes(value)}})])});
  const extraSelected=DISC_FACETS.slice(6).filter(k=>window.A2NDiscovery.choices(disc[k]).length).length+(disc.verified?1:0);
  box.innerHTML=`<p class="sub">${esc(I18N.t('rt.facet.footnote'))}</p>`+groups.slice(0,6).join('')
    +`<details class="facet-more" ${expanded||extraSelected?'open':''}><summary>${esc(I18N.t('rt.facet.more'))}${extraSelected?esc(I18N.t('rt.facet.more_picked',{count:extraSelected})):''}</summary>`+groups.slice(6).join('')
    +_facetGroup(I18N.t('rt.facet.identity'),[{v:'',label:I18N.t('rt.facet.all'),n:null,on:!disc.verified,k:'verified'},{v:'1',label:I18N.t('rt.facet.only_attested'),n:discFiltered('verified').filter(i=>attestedOf(i.card||{})).length,on:disc.verified,k:'verified',tip:I18N.t('rt.facet.attested_title')}])+'</details>';
}
function renderMeta(){const box=$('#resmeta');if(!box)return;const chips=[];
  const push=(k,l,v)=>chips.push(`<span class="chip"><span>${esc(l)}</span><button data-clear="${k}" ${v!==undefined?'data-value="'+esc(v)+'"':''} title="${esc(I18N.t('rt.chip.remove'))}">×</button></span>`);
