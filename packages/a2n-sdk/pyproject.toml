[project]
name = "a2n-sdk"
version = "0.1.0"
description = "A2N SDK：给 Agent 与程序调用（零第三方依赖）"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a2n_sdk = ["web/*.html"]
