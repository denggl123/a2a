[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-account"
version = "0.1.0"
description = "A2N L2：主体多账户管理 + 对等账户配对（一期只建立交易关系，不碰资金）"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "a2n-store", "a2n-custodian"]

[tool.setuptools.packages.find]
where = ["src"]
