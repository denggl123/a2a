[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-ledger"
version = "0.1.0"
description = "A2N 账本：append-only 复式记账 + hash 链（唯一真相源）"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "a2n-store"]

[tool.setuptools.packages.find]
where = ["src"]
