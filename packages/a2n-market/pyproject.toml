[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-market"
version = "0.1.0"
description = "A2N 行情：只读投影与统计事实（不定价）"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "a2n-store", "a2n-ledger", "a2n-settlement"]

[tool.setuptools.packages.find]
where = ["src"]
