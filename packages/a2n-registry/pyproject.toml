[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-registry"
version = "0.1.0"
description = "A2N 注册表：A2A 能力登记、KYA、发现与可达性"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "a2n-store", "a2n-transport"]

[tool.setuptools.packages.find]
where = ["src"]
