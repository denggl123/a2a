[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2n-settlement"
version = "0.1.0"
description = "A2N 清算：分账指令 + 每日对账（差一分即停）"
requires-python = ">=3.11"
dependencies = ["a2n-kernel", "a2n-store", "a2n-ledger", "a2n-custodian"]

[tool.setuptools.packages.find]
where = ["src"]
