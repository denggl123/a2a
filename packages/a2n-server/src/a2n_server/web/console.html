<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2N 管理台</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1c1f23; --muted:#6b7280;
    --blue:#185fa5; --blue-bg:#e6f1fb; --green:#0f6e56; --green-bg:#e1f5ee;
    --amber:#854f0b; --amber-bg:#faeeda; --red:#a32d2d; --red-bg:#fcebeb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
         display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .brand{font-size:16px;font-weight:600}
  .brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  .spacer{flex:1}
  input,select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);
       border-radius:8px;background:#fff;color:var(--ink)}
  button{cursor:pointer;background:var(--blue);border-color:var(--blue);color:#fff}
  button.ghost{background:#fff;color:var(--ink)}
  button:hover{opacity:.88}
  nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 24px}
  nav button{background:none;border:none;color:var(--muted);border-radius:0;
             padding:12px 14px;border-bottom:2px solid transparent}
  nav button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
  main{padding:20px 24px;max-width:1200px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500}
  .card .v{font-size:22px;font-weight:600}
  .card .s{font-size:12px;color:var(--muted);margin-top:4px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .b-ok{background:var(--green-bg);color:var(--green)}
  .b-bad{background:var(--red-bg);color:var(--red)}
  .b-warn{background:var(--amber-bg);color:var(--amber)}
  .b-info{background:var(--blue-bg);color:var(--blue)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
        border-radius:12px;overflow:hidden;font-size:13px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#fafbfc;color:var(--muted);font-weight:500;font-size:12px}
  tr:last-child td{border-bottom:none}
  .sec{margin-bottom:22px}
  .sec h3{margin:0 0 10px;font-size:14px;font-weight:600}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .muted{color:var(--muted)}
  .empty{padding:24px;text-align:center;color:var(--muted);background:#fff;
         border:1px dashed var(--line);border-radius:12px}
  .bar{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden;width:90px}
  .bar i{display:block;height:100%;background:var(--blue)}
  nav .tabmini{color:var(--muted);font-size:13px}
  nav .tabmini.open{color:var(--blue)}
  #more{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--line);padding:8px 24px;flex-wrap:wrap}
  #more .tabbtn{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13px}
  #more .tabbtn.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}
  details summary b{color:var(--ink)}
  .agent-row{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;
             background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .agent-row .name{font-weight:600}
  .agent-row .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .agent-row .side{text-align:right;white-space:nowrap}
  .price-chip{display:inline-block;background:var(--blue-bg);color:var(--blue);
              border-radius:8px;padding:2px 9px;font-size:13px;font-weight:600}
  .sec-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
  /* 四段证据：一段一个框，竖排。刻意不做"综合分"——三段的量纲根本不同，
     求和出来的数字不可解释、也就不可验证。所以这里只有分隔，没有汇总。 */
  .ev-grid{display:grid;gap:10px}
  .ev-seg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .ev-seg .ev-t{font-weight:600;font-size:12px;margin-bottom:6px}
  .ev-seg .kv{grid-template-columns:92px 1fr;gap:4px 10px;margin:0}
  .hide{display:none}
  /* 子页签：把一个大页拆成"发现 / 待使用 / 调用记录"这种一眼可数的小块。
     主入口只留三个 —— 上手难度取决于入口个数，不取决于功能多少。 */
  .subnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
          border-bottom:1px solid var(--line);padding-bottom:10px}
  .subnav .subbtn{background:#fff;border:1px solid var(--line);color:var(--ink);
                  border-radius:999px;padding:5px 14px;font-size:13px}
  .subnav .subbtn.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);font-weight:500}
  .subnav .cnt{color:var(--muted);font-size:11px;margin-left:2px}
  /* 可点条目：明细入口在整行，不是藏在行尾的一个小按钮里 */
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--blue-bg)}
  .rowbtn{cursor:pointer}
  /* 明细抽屉：右滑出。四种列表共用同一形态 —— 用户学一次就够 */
  #drawer{position:fixed;inset:0;background:rgba(20,24,28,.28);display:none;z-index:40}
  #drawer.on{display:block}
  #dr_panel{position:absolute;top:0;right:0;height:100%;width:min(700px,95vw);background:#fff;
            border-left:1px solid var(--line);display:flex;flex-direction:column;
            box-shadow:-8px 0 28px rgba(0,0,0,.10)}
  #dr_head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  #dr_head b{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #dr_body{padding:16px 18px 30px;overflow:auto;flex:1}
  .kv{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;font-size:13px;margin:0 0 14px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;word-break:break-all}
  .dr-h{font-size:13px;margin:16px 0 8px}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{position:relative;padding:0 0 14px 18px;border-left:1px solid var(--line)}
  .tl li:last-child{border-left-color:transparent;padding-bottom:0}
  .tl li::before{content:'';position:absolute;left:-3.5px;top:6px;width:7px;height:7px;
                 border-radius:999px;background:var(--blue)}
  .tl .ev{font-weight:500}
  .tl .tm{color:var(--muted);font-size:11px}
  .pre{background:#f6f7f9;padding:12px;border-radius:10px;overflow:auto;max-height:280px;
       font-size:12px;white-space:pre-wrap}
  /* 维护表单：替掉 window.prompt（不能校验、不能给选项、不能解释口径） */
  #modal{position:fixed;inset:0;background:rgba(20,24,28,.32);display:none;z-index:50;
         align-items:center;justify-content:center}
  #modal.on{display:flex}
  #modal .box{background:#fff;border-radius:14px;padding:18px 20px;width:min(560px,92vw);max-height:88vh;overflow:auto}
  #modal .box h3{margin:0 0 4px;font-size:15px}
  #modal .fld{margin:10px 0}
  #modal .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  #modal .fld input,#modal .fld select,#modal .fld textarea{width:100%}
</style>
</head>
<body>
<header>
  <div class="brand">A2N 管理台<span>只发行情 · 只刻章 · 不碰钱</span></div>
  <div class="spacer"></div>
  <label class="muted">身份</label>
  <input id="principal" value="acct:alice" style="width:150px" title="切换身份查看不同主体的视角">
  <button class="ghost" onclick="loadAll()">刷新</button>
</header>
<nav>
  <button class="tabbtn on" data-tab="find" onclick="tab(this)">找 Agent</button>
  <button class="tabbtn" data-tab="sell" onclick="tab(this)">卖 Agent</button>
  <button class="tabbtn" data-tab="account" onclick="tab(this)">我的账户</button>
  <div class="spacer"></div>
  <button class="tabmini" id="moreBtn" onclick="_toggleMore()">高级功能 ▾</button>
</nav>
<div id="more" class="hide">
  <span class="muted" style="font-size:11px;align-self:center">运营</span>
  <button class="tabbtn" data-tab="overview" onclick="tab(this)">全网总览</button>
  <button class="tabbtn" data-tab="testbed" onclick="tab(this)">调用测试</button>
  <button class="tabbtn" data-tab="settle" onclick="tab(this)">结算与对账</button>
  <span class="muted" style="font-size:11px;align-self:center;margin-left:12px">审计 / 凭证</span>
  <button class="tabbtn" data-tab="chain" onclick="tab(this)">账本与凭证</button>
  <button class="tabbtn" data-tab="arbitration" onclick="tab(this)">争议仲裁</button>
  <button class="tabbtn" data-tab="consensus" onclick="tab(this)">批次共识</button>
  <button class="tabbtn" data-tab="ap2" onclick="tab(this)">AP2 凭证</button>
</div>
<main>
  <section id="find" class="sec"></section>
  <section id="sell" class="sec hide"></section>
  <section id="account" class="sec hide"></section>
  <section id="overview" class="sec hide"></section>
  <section id="testbed" class="sec hide"></section>
  <section id="settle" class="sec hide"></section>
  <section id="chain" class="sec hide"></section>
  <section id="arbitration" class="sec hide"></section>
  <section id="consensus" class="sec hide"></section>
  <section id="ap2" class="sec hide"></section>
</main>

<!-- 明细抽屉：任何列表点条目都开它。全局一个，避免每页各造一套。 -->
<div id="drawer" onclick="if(event.target===this)drawerClose()">
  <div id="dr_panel">
    <div id="dr_head"><b id="dr_title">明细</b>
      <button class="ghost" onclick="drawerClose()">关闭</button></div>
    <div id="dr_body"></div>
  </div>
</div>
<!-- 维护表单：全局一个，替掉所有 window.prompt -->
<div id="modal" onclick="if(event.target===this)_formCancel()"></div>

<script>
const P = () => document.getElementById('principal').value.trim() || 'acct:alice';
// 把服务端错误翻成人话：FastAPI 的错误体是 {"detail": ...}，可能是字符串、
// 领域异常对象（{error, hint}）或 x402 付款挑战（{requirement}）。直接 throw
// 原文会让界面显示一坨裸 JSON——这里统一抽出一条可读消息（原始体留在 err.body）。
async function api(path, opts={}){
  opts.headers = Object.assign({'X-Principal': P(), 'Content-Type':'application/json'}, opts.headers||{});
  const r = await fetch(path, opts);
  if(!r.ok){
    const t = await r.text();
    let msg = t;
    try{
      const j = JSON.parse(t);
      const d = (j && typeof j === 'object' && 'detail' in j) ? j.detail : j;
      if(d && typeof d === 'object'){
        if(d.requirement){                       // 402：x402 付款挑战
          const a = (d.requirement.accepts||[{}])[0];
          const amt = a.maxAmountRequired!=null ? a.maxAmountRequired : '';
          msg = `需要支付 ${amt} ${a.asset||''}${a.network?'（'+a.network+'）':''}`.trim();
        }else if(d.hint && (d.hint.missing||[]).length){   // 403：差哪样、补哪样
          msg = (d.error||'无调用资格') + ' ｜ 可补：' + d.hint.missing.join('、');
        }else{
          msg = d.error || d.message || JSON.stringify(d);
        }
      }else if(typeof d === 'string'){ msg = d; }
    }catch(e){ /* 非 JSON：原样展示 */ }
    const err = new Error(String(msg).slice(0,240));
    err.status = r.status; err.body = t;
    throw err;
  }
  return r.json();
}
// 多源并行取数：单个端点 5xx 不拖垮整页 —— 失败的源以 fallback 顶上，
// 其余照常渲染（Promise.all 是一损俱损：一个端点挂掉整页空白）。
async function apiAll(specs){
  const rs = await Promise.allSettled(specs.map(s=>api(s.path, s.opts||{})));
  return rs.map((r,i)=>{
    if(r.status==='fulfilled') return r.value;
    const f = specs[i].fallback;
    return typeof f === 'function' ? f() : f;
  });
}
// esc 必须连引号一起转义：值进了 href/title/onclick 属性时，不转引号就能被
// 注入内容闭合属性、插入事件处理器（XSS）。
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 积分账本锚 CNY（1 积分 = 0.01 元）：积分展示固定用 ¥
const yuan = p => '¥' + (p/100).toFixed(2);
// 事实金额（任务/账单/凭证）带自己的币种 —— 不是所有钱都是"元"。
// 最小单位整数 + 币种 → 展示串；币种指数按媒介注册口径取（内置常用币种）。
const CUR_EXP = {CNY:2, USD:2, EUR:2, HKD:2, JPY:0, USDC:6};
const CUR_SYM = {CNY:'¥', USD:'$', EUR:'€', HKD:'HK$', JPY:'¥'};
// 金额数字串：最小单位整数 → 主单位，去掉无意义的尾零（USDC 不该显示 0.050000）。
// 本位币（两位小数）保底两位：¥3 显示 3.00、零余额显示 0.00；链上币种则全去（5 USDC 而非 5.00 USDC）。
function amountStr(minor, currency){
  const cur = String(currency||'CNY').toUpperCase();
  const e = (CUR_EXP[cur]!=null) ? CUR_EXP[cur] : 2;
  const v = Number(minor==null?0:minor) / Math.pow(10, e);
  let s = v.toFixed(e);
  if(s.includes('.')){
    s = s.replace(/0+$/, '').replace(/\.$/, '');
    const dp = s.includes('.') ? s.length - s.indexOf('.') - 1 : 0;
    const minDec = (e === 2) ? 2 : 0;
    if(dp < minDec) s = v.toFixed(minDec);
  }
  return s;
}
function curMoney(minor, currency){
  const cur = String(currency||'CNY').toUpperCase();
  const n = amountStr(minor, cur);
  return (CUR_SYM[cur] ? CUR_SYM[cur]+n : n + ' ' + cur);
}
/* 价格输入的换算：表单按**主单位**收（元 / USDC），价目表按**最小单位**存。
   两者只在这一处换算——用户在表单里永远不用心算 10 的幂。 */
const curExp = c => { const k = String(c||'CNY').toUpperCase();
                      return CUR_EXP[k]!=null ? CUR_EXP[k] : 2; };
// 最小单位整数 → 表单里可编辑的数字串（无符号）：3 → "0.03"，5000000 → "5"
function minorToInput(cur, minor){
  const e = curExp(cur);
  return String(Number((Number(minor||0) / Math.pow(10, e)).toFixed(e)));
}
// 最小单位整数 → 带符号的可读串：3 → "¥0.03"，5000000 → "5 USDC"
function minorText(cur, minor){
  const n = amountStr(minor, cur);
  const sym = CUR_SYM[String(cur||'').toUpperCase()];
  return sym ? sym + n : n + ' ' + String(cur||'');
}
// 表单输入 → 最小单位整数。认 3 / ¥0.03 / 0.03 / 1,234.5；非数字返回 NaN（调用方负责报错）
function priceMinorFrom(raw, cur){
  const s = String(raw==null?'':raw).trim().replace(/[¥$€,，\s]/g, '');
  if(!s) return 0;
  const n = Number(s);
  if(!isFinite(n) || n < 0) return NaN;
  return Math.round(n * Math.pow(10, curExp(cur)));
}

const _ADV = ['overview','testbed','settle','chain','arbitration','consensus','ap2'];
function tab(btn){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const t = btn.dataset.tab;
  // 这一行必须和上面的 _ADV、以及 <main> 里的 <section id> 三者对齐。
  // 漏一个的症状：点得动页签，但目标 section 永远带着 hide —— 内容渲染了、就是没显示，
  // 而 innerText 在 display:none 时会回退成 textContent，所以文本断言会**假绿**。
  ['find','sell','account','overview','testbed','settle','chain','arbitration','consensus','ap2']
    .forEach(x=>document.getElementById(x).classList.toggle('hide', x!==t));
  // 高级区：选中高级页自动展开，回到主区自动收起
  const adv = _ADV.includes(t);
  document.getElementById('more').classList.toggle('hide', !adv);
  document.getElementById('moreBtn').classList.toggle('open', adv);
  loadAll();
}
function _toggleMore(){
  const box = document.getElementById('more');
  box.classList.toggle('hide');
  document.getElementById('moreBtn').classList.toggle('open', !box.classList.contains('hide'));
}

/* ================= 信息架构：三个主入口，入口内再分小页 =================
   主入口只有「找 Agent / 卖 Agent / 我的账户」三个 —— 上手难度取决于入口
   个数，不取决于功能多少。功能全放进入口内部的小页与折叠区里。
   子页签只是"显示哪一块"，不重渲染整页：切回来时的状态（筛选、滚动）都还在。 */
const _sub = {find:'discover', sell:'list', account:'info'};
const SUBS = {
  find: [['discover','发现 Agent'], ['hold','待使用'], ['calls','调用记录']],
  sell: [['list','自售列表'], ['calls','他人调用记录'], ['market','行情信息']],
  account: [['info','账户信息'], ['flow','流水列表']],
};
function subnav(page){
  return `<div class="subnav" data-page="${page}">` + SUBS[page].map(([k,label])=>
    `<button class="subbtn${k===_sub[page]?' on':''}" data-sec="${k}"
      onclick="subTab('${page}','${k}')">${esc(label)}<span class="cnt" id="cnt_${page}_${k}"></span></button>`
  ).join('') + `</div>`;
}
function _cnt(page, sec, n){
  const el = document.getElementById(`cnt_${page}_${sec}`);
  if(el) el.textContent = (n==null || n==='') ? '' : ' · '+n;
}
function subTab(page, sec){
  _sub[page] = sec;
  document.querySelectorAll(`.subnav[data-page="${page}"] .subbtn`)
    .forEach(b=>b.classList.toggle('on', b.dataset.sec===sec));
  document.querySelectorAll(`#${page} [data-subsec]`)
    .forEach(el=>el.classList.toggle('hide', el.dataset.subsec!==sec));
  // 懒加载：没打开过的小页第一次进来才取数
  if(page==='find' && sec==='calls') renderMyCalls();
  if(page==='find' && sec==='hold') renderHold();
  if(page==='sell' && sec==='calls') renderProvidedCalls();
  if(page==='sell' && sec==='market') renderMarket();
  if(page==='account' && sec==='flow') loadLedger();
}

/* ================= 明细抽屉：列表只放"一眼要判断的"，点开才是全流程 =========
   时间线取自凭证链（receipts），不是这里另糊一份 —— 用户看到的每一步
   都能在 /v1/notary/verify 里被独立复核。 */
const _dr = {kind:null, id:null};
function drawerOpen(kind, id){
  _dr.kind = kind; _dr.id = id;
  document.getElementById('dr_title').textContent = '明细';
  document.getElementById('dr_body').innerHTML = '<div class="empty">加载中…</div>';
  document.getElementById('drawer').classList.add('on');
  Promise.resolve(_drLoad()).catch(e=>{
    document.getElementById('dr_body').innerHTML =
      `<div class="empty">明细加载失败：${esc(e.message)}</div>`;
  });
}
function drawerClose(){
  document.getElementById('drawer').classList.remove('on');
  _dr.kind = null;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ drawerClose(); _formCancel(); } });
function _drLoad(){
  if(_dr.kind==='call') return _drCall(_dr.id);
  if(_dr.kind==='ledger') return _drLedger(_dr.id);
  if(_dr.kind==='market') return _drMarket(_dr.id);
  if(_dr.kind==='agent') return _drAgent(_dr.id);
  return Promise.resolve();
}
const _taskStateBadge = st =>
  `<span class="badge ${(st==='SETTLED'||st==='ACCEPTED')?'b-ok':(st==='REJECTED'||st==='FAILED'||st==='CANCELED'?'b-bad':'b-info')}">${esc(st||'')}</span>`;

const EV_LABEL = {
  'task.created':'已建任务','task.assigned':'已派单','task.submitted':'节点已交付',
  'acceptance.passed':'验收通过','acceptance.failed':'验收未通过',
  'task.canceled':'任务取消','task.failed':'执行失败',

const _TL_SKIP = new Set(['task_id', 'result_hash', 'card_hash', 'unit_prices']);
function _drTimeline(tl){
  if(!tl || !tl.length)
    return `<h4 class="dr-h">流程</h4><div class="muted" style="font-size:12px">

    <ul class="tl">${tl.map(r=>{

      const extra = Object.entries(p)
        .filter(([k, v]) => !_TL_SKIP.has(k) && v !== null && typeof v !== 'object')
        .map(([k,v])=>`${k}=${v}`).join(' · ');
      return `<li><div class="ev">${esc(EV_LABEL[r.event_type]||r.event_type)}</div>
        <div class="tm mono">${esc((r.created_at||'').slice(0,19))} · ${esc(String(r.hash||'').slice(0,12))}…</div>
        ${extra?`<div class="muted mono" style="font-size:11px">${esc(extra)}</div>`:''}</li>`;

/* 自源 vs 独立：**给差异，不给结论**。
   自己调自己是被允许的（不该为难愿意先跑通一遍的提供者），但它可能被用来刷分。
   这里只把两个原始分均值并排摆出来、各带样本数 —— 不合成"真实分"，也不替使用者
   判定"这是刷分"。样本不足时**不给差值**：给个 0 比不给更误导。 */
function _selfSrcBlock(ss){
  if(!ss || (!ss.self_cases && !ss.independent_cases)) return '';
  const d = ss.delta_raw;
  return `<div style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 0 8px">
    <div style="font-size:12px">自源 vs 独立
      ${ss.comparable
        ? `<span class="badge ${Math.abs(d)>=20?'b-warn':'b-info'}">差值 ${esc(String(d))}</span>`
        : '<span class="badge">样本不足</span>'}</div>
    <div class="muted" style="font-size:11px">
      自源 ${ss.self_cases} 条 · 均值 ${ss.self_mean_raw==null?'—':esc(String(ss.self_mean_raw))}
      ｜ 独立 ${ss.independent_cases} 条 · 均值 ${ss.independent_mean_raw==null?'—':esc(String(ss.independent_mean_raw))}
      <div>${esc(ss.note||'')}</div>
    </div></div>`;
}

/* 给一次**具体交付**打分：一单一条（唯一索引即幂等闸）。
   分数会按"这个评分者给所有人的平均"归一化 —— 只消掉手松/手紧的刻度差，
   不改你的判断。同源（自己调自己）照记但不进公开统计。 */
async function rateTask(taskId){
  const v = await askForm('给这次交付打分',
    '评分绑定这一次具体交付（每单一条）。归一化只消掉"手松/手紧"的刻度差，不改你的判断。', [
    {key:'score', label:'分数（0–100）', required:true, type:'number', value:'80',
     hint:'50 相当于你眼里的中性；比它好就往上，比它差就往下。'},
    {key:'note', label:'备注（可选）', type:'text', placeholder:'哪儿好 / 哪儿不好'},
  ]);
  if(!v) return;
  const score = parseInt(v.score, 10);
  if(!(score >= 0 && score <= 100)) return alert('分数要在 0–100 之间');
  try{
    const r = await api('/v1/tasks/'+encodeURIComponent(taskId)+'/rating',
      {method:'POST', body: JSON.stringify({score, note: v.note||null})});
    alert(r.credited ? `已记录：归一化 ${r.normalized}（μ=${r.mu_used}）`
      : (r.stability ? '已记录（重连采样：是采网络稳定参数的，不进质量统计）'
      : (r.self_source ? '已记录（同源调用，不计入公开统计）'
                       : '已记录：先进本地校准池 —— 你自己满 20 条评分后才会对外发布')));
  }catch(e){ alert('打分失败: '+e.message); }
}

/* ================= 维护表单：替掉 window.prompt =================
   prompt 有三个硬伤：不能校验、不能给选项、不能解释字段含义 ——
   维护动作（达成交易/上报计量/出账/裁定）恰恰三样都需要。 */
let _formResolve = null;
function askForm(title, desc, fields){
  return new Promise(resolve=>{
    _formResolve = resolve;
    const vals = {};
    document.getElementById('modal').innerHTML = `<div class="box">
      <h3>${esc(title)}</h3>
      ${desc?`<p class="muted" style="font-size:12px;margin:4px 0 0">${esc(desc)}</p>`:''}
      ${fields.map(f=>`<div class="fld">
        <label>${esc(f.label)}${f.required?' <span style="color:var(--red)">*</span>':''}</label>
        ${f.type==='select'
          ? `<select id="ff_${esc(f.key)}">${(f.options||[]).map(o=>
              `<option value="${esc(o.v!=null?o.v:o)}" ${String(o.v!=null?o.v:o)===String(f.value||'')?'selected':''}>${esc(o.t||o)}</option>`).join('')}</select>`
          : f.type==='textarea'
          ? `<textarea id="ff_${esc(f.key)}" rows="3" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`
          : `<input id="ff_${esc(f.key)}" type="${esc(f.type||'text')}" value="${esc(f.value!=null?f.value:'')}"
               placeholder="${esc(f.placeholder||'')}">`}
        ${f.hint?`<div class="muted" style="font-size:11px;margin-top:3px">${esc(f.hint)}</div>`:''}
      </div>`).join('')}
      <div id="ff_err" style="color:var(--red);font-size:12px;min-height:16px;margin-top:4px"></div>
      <div class="row" style="margin-top:8px">
        <button onclick="_formOk()">确定</button>
        <button class="ghost" onclick="_formCancel()">取消</button>
      </div>
    </div>`;
    document.getElementById('modal').classList.add('on');
    const first = document.querySelector('#modal .fld input, #modal .fld select, #modal .fld textarea');
    if(first) first.focus();
  });
}
function _formOk(){
  const vals = {};
  document.querySelectorAll('#modal .fld').forEach(d=>{
    const el = d.querySelector('input,select,textarea');
    if(el) vals[el.id.replace(/^ff_/,'')] = el.value;
  });
  if(_formResolve){ const r = _formResolve; _formResolve = null; r(vals); }
  document.getElementById('modal').classList.remove('on');
  document.getElementById('modal').innerHTML = '';
}
function _formCancel(){
  if(_formResolve){ const r = _formResolve; _formResolve = null; r(null); }
  const m = document.getElementById('modal');
  if(m){ m.classList.remove('on'); m.innerHTML = ''; }
}

function priceSummary(cardJson){
  // 价目摘要：v2 多币种价目换成可读金额；没有则回退 v1 提示价；都没有=免费
  try{
    const card = JSON.parse(cardJson||'{}');
    const ext = card['x-a2n'] || {};
    const book = ext.price_book || card.price_book;
    if(book && Object.keys(book).length){
      const parts = [];
      Object.entries(book).forEach(([skill,byCur])=>{
        Object.entries(byCur||{}).forEach(([cur,cfg])=>{
          const cc = (cfg.dimensions||[]).find(d=>d.key==='call_count');
          parts.push(`<div class="mono" style="font-size:11px">${esc(skill)} · ${cc?curMoney(cc.amount,cur)+'/次':esc(cur)+' 计价'}</div>`);
        });
      });
      return parts.join('') || '<span class="muted">免费</span>';
    }
    const hint = ext.price_hint || card.price_hint || {};
    const first = Object.entries(hint)[0];
    return first ? `<div class="mono" style="font-size:11px">${curMoney(first[1].amount,'CNY')}/次</div>` : '<span class="muted">免费</span>';
  }catch(e){ return '-'; }
}

function shelfGenName(){
  return 'agent-' + Math.random().toString(16).slice(2,6);
}
function shelfGenId(){
  // 网络唯一标识：UUID v4（密码学级随机，全域唯一靠概率保证）
  return (crypto.randomUUID ? crypto.randomUUID()
    : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
}
/* 毕业：试用额度用尽、且参数/证据/争议四项都齐，才允许转为收费。

    }catch(_){}

  }
}

function shelfAutoDesc(){

function shelfBuildCard(){
  const skills = [...document.querySelectorAll('#sh_skills .skill_row')]
    .map(r=>({id:r.querySelector('.sk_id').value.trim(),
              name:r.querySelector('.sk_name').value.trim() || r.querySelector('.sk_id').value.trim(),
              tags:r.querySelector('.sk_tags').value.split(/[,，\s]+/).filter(Boolean),
              inputModes:["application/json"]}))
    .filter(s=>s.id);
  if(!skills.length) throw new Error('至少填一条技能');
  let uid = document.getElementById('sh_uid').value.trim();
  if(!uid){ uid = shelfGenId(); document.getElementById('sh_uid').value = uid; }
  const name = document.getElementById('sh_name').value.trim() || shelfGenName();
  document.getElementById('sh_name').value = name;
  let desc = document.getElementById('sh_desc').value.trim();
  if(!desc) shelfAutoDesc();
  desc = document.getElementById('sh_desc').value.trim();
  const accepts = [];
  if(document.getElementById('sh_peer').checked) accepts.push('peer_account');
  if(document.getElementById('sh_direct').checked){
    const ch = document.getElementById('sh_channel').value.trim().toLowerCase();
    accepts.push(ch ? 'direct_pay:'+ch : 'direct_pay');
  }
  if(document.getElementById('sh_x402').checked) accepts.push('x402');
  const dims = [...document.querySelectorAll('.sh_dim:checked')].map(cb=>cb.value);
  const card = {
    name, description: desc,
    version: document.getElementById('sh_version').value.trim() || '1.0.0',
    url: document.getElementById('sh_url').value.trim() || null,
    skills,
    "x-a2n": {
      uid,
      deployment: {region: document.getElementById('sh_region').value.trim() || null},
      sla: {max_latency_ms: parseInt(document.getElementById('sh_lat').value,10)||null},
      metering: {dimensions: dims.map(k=>({key:k, unit:k, verifiable:k!=='gpu_seconds'}))},
    },
  };
  if(accepts.length) card.accepts = accepts;
  const cur = document.getElementById('sh_price_cur').value;
  const price = cur ? priceMinorFrom(document.getElementById('sh_price').value, cur) : 0;
  if(isNaN(price)) throw new Error('价格请填数字，可带符号，如 0.03 或 ¥0.03');
  if(cur && price>0 && skills.length){
    card['x-a2n'].price_book = {[skills[0].id]: {[cur]:
      {dimensions:[{key:'call_count', amount:price, per:1}]}}};
  }
  return card;
}
async function shelfSave(){
  let card;
  try{ card = shelfBuildCard(); }
  catch(e){ return alert(e.message); }
  // 上架名额：数量填错就地挡下（服务端还有一道形状闸，这里只是别让用户白等一次往返）
  const seatRaw = document.getElementById('sh_seat').value.trim();
  const seat = seatRaw==='' ? 0 : Number(seatRaw);
  if(!Number.isInteger(seat) || seat < 0)
    return alert('「允许被发现的数量」填 0 或正整数：0 = 不限');
  try{
    if(_shelfAgentId){
      // 卡（自签内容）与上架信息（分发策略）分两条路走：改名额不该动卡，
      // 更不该由平台改写卡 —— 那会让供给方的自签当场失效（签名域=整张卡）。
      await api('/v1/registry/agents/'+_shelfAgentId+'/card',{method:'PUT',body:JSON.stringify({card})});
      await api('/v1/registry/agents/'+_shelfAgentId+'/listing',{method:'PUT',body:JSON.stringify({discover_limit:seat})});
    }else{
      await api('/v1/registry/agents',{method:'POST',body:JSON.stringify({card, visibility:'public', discover_limit:seat})});
    }
  }catch(e){ return alert('保存失败: '+e.message); }
  _shelfAgentId = null;
  document.getElementById('shelf_box').innerHTML = '';
  loadAll();
}

async function savePriceBook(agentId){

/* （原「我管理的」页已拆分：「我发起的任务」并入「我的账户」，「我的市场列表」并入「找 Agent」收藏） */


/* ---------- 找 Agent：一个搜索框 + 全网列表 + 收藏 + 试调用/配对面板 ---------- */
const _disc = { agents:[], roster:[], q:'', ts:null, err:'', mine:[], peers:[], pay:'',
                region:'', min_rep:0, max_price:'', callable:false, verified:false };

function _discCard(a){ try{ return JSON.parse(a.card_json||'{}'); }catch(e){ return {}; } }

/* 卡片自证的结论：**服务端随行带出的**，不是前端猜的。
   signed=卡自带身份且验签通过；unattested=卡没声明身份（能发现，但不等于验过）；
   invalid / tampered 服务端已经排除，压根不会出现在列表里。
   "在你列表里就等于验过了"——靠的就是不把 unattested 说成验过。 */
function _discProof(a){
  const sp = (a && a.selfproof) || 'unknown';
  return { signed: sp==='signed', sp, reason: (a && a.card_verify_reason) || '' };
}

function _ago(ts){
  if(!ts) return '';
  const s = Math.max(0,(Date.now() - new Date(ts).getTime())/1000);
  if(s < 3600) return Math.round(s/60)+' 分钟前';
  if(s < 86400) return Math.round(s/3600)+' 小时前';
  return Math.round(s/86400)+' 天前';
}

// 能否调用是**能力**判定，不是"有没有配对"：免费 / 已配对的对等账户 /
// 我绑定的直付渠道 ∩ 对方 accepts / 对方接受 x402（调用时出 402 挑战）。
// 与服务端 gate.resolve 同一套语义——这里只是提前告诉你要不要补、补什么。
function _discCap(a, c){
  if(_priceText(c) === '免费') return {ok:true, why:'免费'};
  const acc = [].concat(c.accepts||(c['x-a2n']||{}).accepts||[]);
  const mine = new Set(_disc.mine||[]);
  if(acc.includes('x402')) return {ok:true, why:'x402（调用时付款）'};
  const picked = [];
  if(acc.includes('peer_account')
     && (_disc.peers||[]).some(p=>p.agent_id===a.agent_id && p.state==='ACTIVE'))
    picked.push('对等账户');
  for(const t of acc){
    const [base, ch] = String(t).split(':');
    if(base==='direct_pay' && (ch ? mine.has(ch) : mine.size)) picked.push('直付渠道');
  }
  if(picked.length) return {ok:true, why:'可用 '+picked[0]};
  return {ok:false, why:'需补充支付方式'};
}

// 取"每次调用"的价目（币种 + 最小单位）。免费返回 {cur:null, minor:0}；
// 只写了别种维度没写 call_count 的返回 minor:null —— 不知道就不假装知道。
function _callPrice(c){
  const ext = c['x-a2n']||{};
  const book = ext.price_book || c.price_book;
  try{
    if(book && Object.keys(book).length){
      const byCur = Object.values(book)[0]||{};
      const cur = Object.keys(byCur)[0];
      const cc = ((byCur[cur]||{}).dimensions||[]).find(d=>d.key==='call_count');
      return {cur, minor: cc ? Number(cc.amount)||0 : null};
    }
    const hint = ext.price_hint || c.price_hint || {};
    const first = Object.entries(hint)[0];
    if(first) return {cur:'CNY', minor:Number(first[1].amount)||0};
  }catch(e){}
  return {cur:null, minor:0};   // 没有价目 = 免费
}

function _discFiltered(){
  const q = _disc.q.trim().toLowerCase();
  const pay = _disc.pay;
  const cap = String(_disc.max_price||'').trim();
  const capMinor = cap==='' ? null : priceMinorFrom(cap, 'CNY');   // 价格上限按元填，只对 CNY 价目生效
  const rep = Number(_disc.min_rep)||0;
  return _disc.agents.filter(a=>{
    const c = _discCard(a);
    const acc = [].concat(c.accepts||(c['x-a2n']||{}).accepts||[]);
    if(pay === 'free' && _priceText(c) !== '免费') return false;
    if(pay === 'peer_account' && !acc.includes('peer_account')) return false;
    if(pay.startsWith('direct_pay:') && !acc.includes(pay)) return false;
    if(_disc.region && (a.region||(a.compute||{}).region||'') !== _disc.region) return false;
    if(rep && (Number(a.reputation||0)*100) < rep) return false;
    if(_disc.callable && !(_discCap(a, c).ok && _discProof(a).signed)) return false;
    if(_disc.verified && !_discProof(a).signed) return false;
    if(capMinor!=null && !isNaN(capMinor)){
      const p = _callPrice(c);
      if(p.cur==='CNY' && p.minor!=null && p.minor > capMinor) return false;
    }
    if(!q) return true;
    return [a.name, a.agent_id, a.uid, c.description,
            (c.skills||[]).map(s=>(s.id||'')+' '+(s.name||'')).join(' ')]
      .join(' ').toLowerCase().includes(q);
  });
}

async function _discFetch(manual){
  const [aRes, rRes, mRes, pRes] = await Promise.allSettled([
    api('/v1/registry/agents', {headers:{'X-Principal':''}}),   // 全网视角：不带身份
    api('/v1/roster'),                                          // 我的收藏：带身份
    api('/v1/pay-methods'),                                     // 我已绑定的直付渠道
    api('/v1/peers'),                                           // 我的对等账户配对
  ]);
  if(aRes.status==='fulfilled'){ _disc.agents = aRes.value||[]; _disc.ts = new Date(); _disc.err=''; }
  else if(manual){ alert('加载失败: '+aRes.reason.message); return; }
  else _disc.err = '刷新失败';
  _disc.roster = rRes.status==='fulfilled' ? (rRes.value||[]) : [];
  _disc.mine = mRes.status==='fulfilled'
    ? [...new Set((mRes.value||[]).filter(m=>m.status==='ACTIVE').map(m=>m.channel))] : [];
  _disc.peers = pRes.status==='fulfilled' ? (pRes.value||[]) : [];
  _discRender();
}

function _priceText(c){
  // 买家视角的一句话价格：v2 价目 → v1 提示价 → 免费
  const ext = c['x-a2n']||{};
  const book = ext.price_book || c.price_book;
  try{
    if(book && Object.keys(book).length){
      const byCur = Object.values(book)[0]||{};
      const cur = Object.keys(byCur)[0];
      const cc = ((byCur[cur]||{}).dimensions||[]).find(d=>d.key==='call_count');
      return cc ? curMoney(cc.amount,cur)+'/次' : Object.keys(byCur).join('/')+' 计价';
    }
    const hint = ext.price_hint || c.price_hint || {};
    const first = Object.entries(hint)[0];
    if(first) return curMoney(first[1].amount,'CNY')+'/次';
  }catch(e){}
  return '免费';
}

function _shortId(id){
  const s = String(id||'');
  return s.length > 14 ? s.slice(0,14)+'…' : s;
}
// agent_id 是给机器看的：能翻到名字就显示名字，翻不到就照实显示 id，不编。
function _agentName(id){
  const s = String(id||'');
  const hit = (_disc.agents||[]).find(a=>a.agent_id===s)
           || (_disc.roster||[]).find(a=>a.agent_id===s);
  return (hit && hit.name) || s || '-';
}
// 收藏（/v1/roster）不带证据摘要，从发现快照里按 id 翻出来 —— 两处说同一件事。
function _evOf(agentId){
  const hit = (_disc.agents||[]).find(a=>a.agent_id===agentId);
  return hit && hit.evidence;
}
// 信誉 0–100 → 一句人话；分档只为看懂，不改判定（判定永远在门禁）
function _repTier(pct){
  if(pct >= 80) return {t:'可靠', c:'b-ok'};
  if(pct >= 60) return {t:'一般', c:'b-info'};
  if(pct >= 40) return {t:'待观察', c:'b-warn'};
  return {t:'风险偏高', c:'b-bad'};
}
/* 试用徽标：列表行要一眼看出"这个 agent 现在免费还是收费"。
   判据与服务端门禁同源（额度用尽即不再"试用中"）—— 界面绝不挂一个
   门禁早已按收费处理的"试用中 10/10"。
   重连补出来的那一段要单独说：它是给节点重新上线**采网络稳定参数**用的，
   那些案例不进质量模板 —— 不标出来，用户会把它当质量证据。 */
function _trialBadge(ev){
  const t = (ev||{}).trial;
  if(!t) return '';
  if(t.trial){
    if(t.stability)
      return `<span class="badge b-info" title="节点重连后补的额度，用来采网络稳定参数。这些案例不进质量模板：它们不是质量证据。每自然日最多补 1 次、生命周期累计 ≤30 次。">试用中 ${t.used}/${t.cap} · 免费（重连采样）</span>`;
    return `<span class="badge b-info" title="新 agent 的免费期：任何一次完成（验收通过）的调用都计数，含自己调自己。卡上不能声明退出——想被发现的 agent 都得先免费服务这 10 次；额度用尽后毕业才可收费。">试用中 ${t.used}/${t.cap} · 免费</span>`;
  }
  return `<span class="badge b-ok" title="免费期已走完（或已毕业）；此后按价目表收费。">已毕业 · 收费</span>`;
}
/* 上架名额徽标：供给方设的"允许被几个人发现"，以及此刻占了多少。
   它是**分发策略**不是能力：满员后新使用者搜不到它，已在用的不受影响；
   按使用者计名额、闲置自动释放 —— 所以数字会自己回落，不是"用完了就没了"。
   0/缺省 = 不限，不显示徽标（大多数 agent 属于这种，列表别被噪声塞满）。 */
function _seatBadge(st){
  if(!st || st.unlimited) return '';
  const used = Number(st.used)||0, limit = Number(st.limit)||0;
  const full = !!st.full;
  return `<span class="badge ${full?'b-warn':'b-info'}"
    title="允许被发现的数量：同时最多 ${limit} 个使用者。满员后新使用者搜不到它，已在用的不受影响；名额按使用者算，闲置 30 分钟自动释放一个 —— 它压的是「同时」，不是「累计」。">名额 ${used}/${limit}${full?' · 已满':''}</span>`;
}
/* 明细里说全：名额多少、谁在占（占用者名单只有 owner 拿得到 —— 见 seats.usage）。
   没有名额的那句要写"不限"，因为"什么都没显示"跟"不限"在界面上是同一张脸。 */
function _seatDetail(a){
  const st = a && a.seats;
  if(!st || st.unlimited) return '<span class="muted">不限（谁都能发现它）</span>';
  const limit = Number(st.limit)||0;
  const hold = (st.holders||[]).map(h=>esc(h.principal_id)).join('、');
  return `${_seatBadge(st)} <span class="muted">同时最多 ${limit} 个使用者` +
    (hold?` · 正在用：${hold}`:'') +
    `；满员后新使用者搜不到它，已在用的不受影响，闲置 30 分钟自动释放一个</span>`;
}
// 证据可用性徽标：有质量偏差 / 已发布评分 才挂；没有就不挂（不拿"暂无"当噪音）。
// 三段各自独立，绝不并成一个综合分。
function _evBadges(ev){
  const out = [_trialBadge(ev)];
  const q = (ev||{}).quality, r = (ev||{}).ratings;
  if(q && q.measured)
    out.push(`<span class="badge b-info" title="按声明的验收模板算出的一次交付偏差（0 = 与模板完全一致）；点开 Agent 明细可看每一维。">偏差 ${q.quality}</span>`);
  if(r && r.published)
    out.push(`<span class="badge b-ok" title="归一化后的使用评价（已按每个评分者的平均分锚到 50）。">评分 ${r.score}</span>`);
  return out.filter(Boolean).join(' ');
}
// 状态徽标的解释：状态是平台给的，用户得知道它意味着什么
const STATUS_TIP = {
  ACTIVE: '已生效：可以接单并参与派发',
  PROBATION: '观察期：新上架，还没攒够通过验收的调用（满 3 次转正）；此时仍可被调用，只是派发权重低',
  SUSPENDED: '已暂停：暂时不接单',
  BANNED: '已封禁：不可调用',
};

function _discRender(){
  const box = document.getElementById('d_table');
  if(!box) return;
  _discPayRender();
  const shown = _discFiltered();
  const meta = document.getElementById('d_meta');
  if(meta) meta.textContent = `${shown.length} 个 Agent` +
    (_disc.ts?` · 刷新于 ${_disc.ts.toLocaleTimeString()}`:'') + (_disc.err?` · ${_disc.err}`:'');
  const mine = new Set(_disc.roster.map(r=>r.agent_id));
  box.innerHTML = shown.length ? shown.map(a=>{
    const c = _discCard(a);
    const acc = [].concat(c.accepts||[]);
    const skills = (c.skills||[]).map(s=>s.id).join('、');
    const desc = c.description||'';
    const sla = (c['x-a2n']||{}).sla || c.sla || {};
    const sb = a.status==='ACTIVE'?'b-ok':(a.status==='PROBATION'?'b-warn':'b-info');
    const price = _priceText(c);
    const cap = _discCap(a, c);
    const proof = _discProof(a);
    const pct = Math.round((Number(a.reputation||0))*100);
    const tier = _repTier(pct);
    const payBadges = [];
    // 卡片自证徽标（服务端结论）：没自证就不给"可直接调用"——
    // 发现和可用必须是同一件事，否则"在你列表里"会被读成"验过了"。
    if(!proof.signed){
      payBadges.push(`<span class="badge b-warn" title="${esc(proof.reason
        || '这张卡没有自证身份（x-a2n.sovereign 为空）：无法确认卡上的 did 就是它的钥匙签的')}">未自证身份</span>`);
    }
    if(cap.ok && proof.signed) payBadges.push(`<span class="badge b-ok">可直接调用 · ${esc(cap.why)}</span>`);
    else if(proof.signed) payBadges.push(`<span class="badge b-warn">${esc(cap.why)}</span>`);
    if(acc.includes('x402')) payBadges.push('<span class="badge b-info">x402</span>');
    return `<div class="agent-row">
      <div style="flex:1;min-width:0">
        <div><span class="name">${esc(a.name||a.agent_id)}</span>
          <span class="badge ${sb}" title="${esc(STATUS_TIP[a.status]||'平台给的状态标记')}">${esc(a.status)}</span> ${payBadges.join(' ')}
          ${_seatBadge(a.seats)}
          ${_evBadges(a.evidence)}</div>
        ${desc?`<div class="sub">${esc(desc).slice(0,80)}${desc.length>80?'…':''}</div>`:''}
        <div class="sub mono">${esc(skills||'-')} · ${esc(a.region||(a.compute||{}).region||'属地未知')}</div>
        <div class="sub">信誉 <b>${pct}</b>/100 <span class="badge ${tier.c}"
            title="0–100，按验收通过率与历史累计；越低越该先小额试跑">${tier.t}</span>
          <span class="bar" style="display:inline-block;vertical-align:middle;margin:0 6px" title="信誉可视化"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></span>
          承诺 ≤${sla.max_latency_ms!=null?sla.max_latency_ms+'ms':'—'}<span class="muted" title="供给方自报的延迟承诺（SLA），不是平台实测；平台实测延迟见「调用测试」的端到端耗时">（自报）</span>
          · ${a.last_seen_at?'在线 '+_ago(a.last_seen_at):'未见到线'}</div>
      </div>
      <div class="side">
        <div><span class="price-chip">${price}</span></div>
        <div class="mono muted" style="font-size:10px;margin-top:2px" title="${esc(a.agent_id)}（内部标识：写 SDK / 配客户端时用）">${esc(_shortId(a.agent_id))}</div>
        <div style="margin-top:6px">
          ${acc.includes('peer_account')?`<button class="ghost" onclick="pairPanel('${esc(a.agent_id)}')">用我的账户配对</button>`:''}
          <button class="ghost" onclick="quickCallPanel('${esc(a.agent_id)}')">试调用</button>
          ${cap.ok?'':`<button class="ghost" onclick="document.querySelector('.tabbtn[data-tab=account]').click()" title="到「我的账户」绑定一种支付方式，绑定后即可直接调用">补支付方式</button>`}
          <button class="ghost" onclick="cardPanel('${esc(a.agent_id)}')" title="查看对外卡片（可复制带走）">卡片</button>
          <button class="ghost" onclick="rosterToggle('${esc(a.agent_id)}')"
            title="加进「待使用」名单，之后到那一页就能直接调用，不用每次重搜">${mine.has(a.agent_id)?'移出待使用':'加入待使用'}</button>
        </div>
      </div>
    </div>`;}).join('')
    : `<div class="empty">${_disc.q? '没有匹配的 Agent——换个关键词试试':'暂无可用的 Agent'}</div>`;
  // 发现区与待使用区共享同一份 agents/roster 快照：这里取完数顺手把
  // 待使用那一页的计数与列表同步掉，免得两个入口各说各的。
  renderHold();
}

async function _fcRun(agentId, hid){
  hid = hid || 'f_call';
  const sel = document.getElementById(hid+'_skill');
  const raw = document.getElementById(hid+'_skill_raw');
  const skill = String((raw && raw.value.trim()) || (sel && sel.value) || '').trim();
  let payload = {};
  const pel = document.getElementById(hid+'_payload');
  const praw = pel ? pel.value.trim() : '';
  if(praw){ try{ payload = JSON.parse(praw); }catch(e){ return alert('参数 JSON 解析失败'); } }
  const t0 = performance.now();
  try{
    const r = await callAgent(agentId, skill, payload);
    _tbOut(hid+'_out', true, Math.round(performance.now()-t0), JSON.stringify(r,null,2));
  }catch(e){
    _tbOut(hid+'_out', false, Math.round(performance.now()-t0), e.message);
  }
}

function _cardCopy(){
  const el = document.getElementById('card_body');
  const out = document.getElementById('card_out');
  if(!el || !out) return;
  const done = ok => { out.innerHTML = ok
    ? '<span class="badge b-ok">已复制到剪贴板</span>'
    : '<span class="badge b-warn">复制失败——请手动选择文本复制</span>'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.textContent).then(()=>done(true), ()=>done(false));
    return;
  }
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  done(ok);
}

/* ---------- 调用测试台：直连 + 使用端聚合（配置存浏览器，平台零感知） ----------
   聚合策略与 SDK Aggregator 同构：round_robin / weighted(SWRR) + 冷却退避 + 半开。
   两个模式都走真实治理链：POST /v1/invoke（门禁→建任务→执行→验收→记账）；耗时为端到端实测。 */
let _tb = { agents: [], trail: [],
            cfg: JSON.parse(localStorage.getItem('a2n_agg_cfg') || 'null')
                 || {strategy:'weighted', cooldown_ms:30000, candidates:[]} };

function _tbSave(){ localStorage.setItem('a2n_agg_cfg', JSON.stringify(_tb.cfg)); }

async function callAgent(agentId, skill, payload){
  // 与 SDK call_agent 同一条链：POST /v1/invoke（门禁 → 建任务 → 执行 → 验收 → 记账）。
  // 门禁是"能力"不是"配对"：对等账户/直付渠道/x402/免费都认；402 挑战体在错误里回显。
  const r = await api('/v1/invoke', {method:'POST',
    body: JSON.stringify({agent_id: agentId, skill: skill || '', payload: payload || {}})});
  return r;
}

function _tbReward(c, ms){ c.ok=(c.ok||0)+1; c.streak=0; c.rtt=[ms, ...(c.rtt||[])].slice(0,20); }
function _tbPenalize(c){
  c.fail=(c.fail||0)+1; c.streak=(c.streak||0)+1;
  c.cool_until = Date.now() + (_tb.cfg.cooldown_ms||30000) * Math.min(c.streak, 5);
}

function _tbOrder(){
  // 与 SDK 同逻辑：冷却过滤在先；全员冷却时半开探测冷却最早到期的
  const now = Date.now();
  let alive = _tb.cfg.candidates.filter(c=>(c.cool_until||0) <= now);
  if(!alive.length)
    alive = [..._tb.cfg.candidates].sort((a,b)=>(a.cool_until||0)-(b.cool_until||0)).slice(0,1);
  if(_tb.cfg.strategy === 'round_robin'){
    _tb.state ??= {}; _tb.state.rr = (_tb.state.rr ?? -1) + 1;
    const n = alive.length;
    return alive.map((_,i)=>alive[(_tb.state.rr + i) % n]);
  }
  const st = _tb.state ??= {}; st.swrr ??= {};
  const total = alive.reduce((s,c)=>s+(c.weight||1), 0);
  alive.forEach(c=>st.swrr[c.agent_id]=(st.swrr[c.agent_id]||0)+(c.weight||1));
  const pick = alive.reduce((a,b)=>st.swrr[a.agent_id] >= st.swrr[b.agent_id] ? a : b);
  st.swrr[pick.agent_id] -= total;
  return [pick, ...alive.filter(c=>c!==pick).sort((a,b)=>st.swrr[b.agent_id]-st.swrr[a.agent_id])];
}

async function _tbDirectCall(){
  const agent = document.getElementById('tb_d_agent').value.trim();
  const path = document.getElementById('tb_d_path').value.trim();
  if(!agent){ alert('填 agent_id'); return; }
  let payload; try{ payload = _tbPayload('tb_d_payload'); }
  catch(e){ alert('payload 错误: '+e.message); return; }
  const t0 = performance.now();
  try{
    const r = await callAgent(agent, path, payload);

  }catch(e){
    _tbOut('tb_direct_out', false, Math.round(performance.now()-t0), e.message);
  }
}

async function _tbAggCall(){
  const skill = document.getElementById('tb_a_skill').value.trim();
  if(!skill){ alert('填 skill'); return; }
  if(!_tb.cfg.candidates.length){ alert('先添加候选'); return; }
  let payload; try{ payload = _tbPayload('tb_a_payload'); }
  catch(e){ alert('payload 错误: '+e.message); return; }
  const trail = []; let out;
  for(const c of _tbOrder()){
    const t0 = performance.now();
    try{
      out = await callAgent(c.agent_id, skill, payload);
      const ms = Math.round(performance.now()-t0);
      _tbReward(c, ms);
      trail.push({agent_id: c.agent_id, ok: true, ms});
      _tbTrailRender(trail, out); _tbRenderCands(); _tbSave();
      return;
    }catch(e){
      const ms = Math.round(performance.now()-t0);
      _tbPenalize(c);
      trail.push({agent_id: c.agent_id, ok: false, ms, err: String(e.message).slice(0,140)});
      _tbTrailRender(trail); _tbRenderCands();
    }
  }
  _tbSave();
  _tbTrailRender(trail, null, '全部候选失败');
}

function fillMediaOptions(){
  const cur = document.getElementById('pa2_currency').value;
  const sel = document.getElementById('pa2_medium');
  const opts = (window._medias||[]).filter(m=>m.currency===cur);
  sel.innerHTML = opts.map(m=>`<option value="${esc(m.code)}">${esc(m.label||m.code)}（${esc(m.network||'-')}）</option>`).join('')
    || '<option value="">该币种无媒介</option>';
}
let _ledCache = [];
function renderLedger(led){
  // 「对方」是 agent_id，对人不友好：有名字就显示名字，id 收进小字与 hover；
  // 认不出的（对等主体/外部账号）原样显示，不做假翻译。
  const nm = id => (window._agentNames && window._agentNames.get(id)) || '';
  _ledCache = (led && led.items) || [];      // 抽屉按行号取这一份快照，不重取
  document.getElementById('ledger_body').innerHTML = _ledCache.length?`
    <table><thead><tr><th>时间</th><th>方向</th><th>对方</th><th>方式</th><th>金额</th><th>状态</th><th>说明</th></tr></thead><tbody>
    ${_ledCache.map((i,idx)=>{const cpn=String(i.counterparty||''); const name=nm(cpn);
      return `<tr class="clickable" onclick="drawerOpen('ledger',${idx})">
      <td class="muted">${esc(String(i.happened_at||'').slice(0,19))}</td>
      <td><span class="badge ${i.direction==='in'?'b-ok':'b-info'}">${i.direction==='in'?'收':'付'}</span></td>
      <td>${name
        ? `<b>${esc(name)}</b><div class="mono muted" style="font-size:11px" title="${esc(cpn)}">${esc(cpn.slice(0,18))}${cpn.length>18?'…':''}</div>`
        : `<span class="mono" title="${esc(cpn)}">${esc(cpn.slice(0,24))}${cpn.length>24?'…':''}</span>`}</td>
      <td class="muted">${esc(i.channel)} · ${esc(i.kind)}</td>
      <td class="mono"><b>${esc(i.display)}</b><div class="muted" style="font-size:11px">${i.amount_minor} 最小单位</div></td>
      <td><span class="badge ${i.state==='CAPTURED'||i.state==='SETTLED'?'b-ok':'b-warn'}">${esc(i.state)}</span></td>
      <td class="muted">${esc(i.note||'')}</td></tr>`;}).join('')}
    </tbody></table>`:'<div class="empty">还没有流水。调一次收费 agent，或出一笔对等账单。</div>';
}
async function loadLedger(){
  const cur = document.getElementById('led_cur').value;
  const dir = document.getElementById('led_dir').value;
  const led = await api('/v1/ledger?limit=100'+(cur?'&currency='+cur:'')+(dir?'&direction='+dir:''));
  renderLedger(led);
}
async function newPartyAccount2(){
  const label = document.getElementById('pa2_label').value.trim();
  if(!label) return alert('填个备注名');
  const body = {
    label,
    currency: document.getElementById('pa2_currency').value,
    medium: document.getElementById('pa2_medium').value || null,
    direction: document.getElementById('pa2_direction').value,
    ref: document.getElementById('pa2_ref').value.trim() || null,
    address: document.getElementById('pa2_addr').value.trim() || null,
  };
  try{ await api('/v1/party-accounts',{method:'POST',body:JSON.stringify(body)}); }
  catch(e){ return alert('建账户失败: '+e.message); }
  loadAll();
}

  h += mine.length ? `<table><thead><tr><th>渠道</th><th>结算币种</th><th>凭据（已掩码）</th><th>自动结算</th><th>状态</th><th>绑定时间</th><th>操作</th></tr></thead><tbody>

      ${f.type==='select'
        ? `<select id="bf_${esc(f.key)}" style="width:240px">${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`
        : `<input id="bf_${esc(f.key)}" type="${f.mask?'password':'text'}" placeholder="${esc(f.placeholder||'')}" style="width:240px">`}
      <span class="muted" style="font-size:12px">${esc(f.hint||f.pattern_hint||'')}</span>
    </div>`).join('')}
    <div class="row" style="margin-top:10px">
      <button onclick="bindSubmit('${esc(ch)}')">确认绑定</button>
      <button class="ghost" onclick="document.getElementById('guide_panel').innerHTML=''">取消</button>
      <span id="bind_msg" class="muted" style="font-size:12px">A2N 不碰钱：只记录绑定声明，资金走渠道；绑定后调用自动结算</span>
    </div>
  </div>`;
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

async function bindSubmit(ch){
  const g = _guides.find(x=>x.channel===ch);
  const fields = {};
  (g.fields||[]).forEach(f=>{
    const el = document.getElementById('bf_'+f.key);
    if(el && el.value.trim()) fields[f.key] = el.value.trim();
  });
  try{
    await api('/v1/pay-methods',{method:'POST',body:JSON.stringify({channel:ch, fields:fields})});
  }catch(e){ 
    const msg = document.getElementById('bind_msg');
    if(msg){ msg.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
    return;
  }
  const msg = document.getElementById('bind_msg');
  if(msg) msg.innerHTML = `<span style="color:var(--green);font-weight:600">✓ 已绑定，调用时自动结算</span>`;
  setTimeout(loadAll, 900);
}

/* 维护动作一律走表单，不用 window.prompt：prompt 不能校验、不能给选项、
   不能解释字段，而这几步（达成/上报/出账/裁定）三样都需要 —— 尤其裁定，
   写进凭证链就不可改了，至少得让人看清自己选了哪一档。 */
async function openDeal(link){
  const v = await askForm('达成一笔对等交易',
    '交易按条款快照计价，事后改条款无效。达成后：交付 → 双方上报计量 → 对账 → 出账。',
    [{key:'skill', label:'做什么（skill id）', value:'ocr-pro', required:true,
      hint:'取供给方卡上声明的 skills[].id'}]);
  if(!v) return;
  try{ await api('/v1/deals',{method:'POST',body:JSON.stringify({link_id:link, skill:v.skill.trim()})}); }
  catch(e){ return alert('达成失败: '+e.message); }
  loadAll();
}
async function reportDeal(id){
  const v = await askForm('上报本侧计量',
    '双方各自上报，A2N 只记录事实，不替任何一方下结论；对账时两份事实摆在一起看。',
    [{key:'party', label:'哪一方上报', type:'select', value:'provider',
      options:[{v:'provider',t:'供给方（provider）'},{v:'requester',t:'使用方（requester）'}]},
     {key:'dims', label:'计量维度 JSON', type:'textarea', value:'{"call_count":1}',
      hint:'如 {"call_count":1}；只有已注册且可计费的维度会进金额'}]);
  if(!v) return;
  let dims = {};
  try{ dims = v.dims.trim() ? JSON.parse(v.dims) : {}; }catch(e){ return alert('JSON 解析失败'); }
  try{ await api('/v1/deals/'+id+'/report',{method:'POST',body:JSON.stringify({party:v.party, dims})}); }
  catch(e){ return alert('上报失败: '+e.message); }
  loadAll();
}
async function reconDeal(id){
  try{ const d = await api('/v1/deals/'+id+'/reconcile',{method:'POST'});
    const cur = (d.recon||{}).currency||'CNY';
    alert(d.recon&&d.recon.matched
      ? '对账一致：'+curMoney(d.recon.amount_minor!=null?d.recon.amount_minor:d.recon.amount_fen, cur)
      : '双方有分歧，已转争议（差 '+curMoney((d.recon||{}).delta_minor!=null?d.recon.delta_minor:(d.recon||{}).delta_fen||0, cur)+'）');
  }catch(e){ alert('对账失败: '+e.message); }
  loadAll();
}
async function issueStatement(link){
  const v = await askForm('出账',
    '把这一段账期内已对账一致的交易合成一张账单。同一配对同一账期只会有一张。',
    [{key:'period', label:'账期（YYYY-MM）', required:true,
      value:new Date().toISOString().slice(0,7)}]);
  if(!v) return;
  try{ const s = await api('/v1/statements',{method:'POST',
      body:JSON.stringify({link_id:link, period:v.period.trim()})});
    alert('已出账：'+s.deal_count+' 笔，共 '+
      curMoney(s.total_minor!=null?s.total_minor:s.total_fen, s.currency));
  }catch(e){ alert('出账失败: '+e.message); }
  loadAll();
}

/* ---------- 仲裁 / 共识 / AP2 ---------- */
async function renderArbitration(){
  const ds = await api('/v1/arbitration/disputes?limit=50');
  document.getElementById('arbitration').innerHTML = `
    <div class="sec"><h3>争议工作台</h3>
    <p class="muted">验收不通过自动开单（system）· 任何一方可申诉 · 裁定写进凭证链，退款由结算层按份额追回。</p>
    ${ds.length?`<table><thead><tr><th>单号</th><th>任务</th><th>申诉方</th><th>理由</th><th>状态</th><th>裁定</th><th>操作</th></tr></thead><tbody>
      ${ds.map(d=>`<tr><td class="mono">${esc(d.id)}</td><td class="mono">${esc(d.task_id).slice(0,18)}</td>
        <td><span class="badge ${d.side==='node'?'b-info':'b-warn'}">${d.side}</span> <span class="muted">${esc(d.opened_by)}</span></td>
        <td class="muted">${esc(d.reason).slice(0,60)}</td>
        <td><span class="badge ${d.state==='OPEN'?'b-warn':'b-ok'}">${d.state}</span></td>
        <td class="mono">${d.ruling?esc(d.ruling)+(d.refund_fen?' · 退'+d.refund_fen:''):'-'}<div class="muted">${esc(d.arbitrator||'')}</div></td>
        <td>${d.state==='OPEN'?`<button class="ghost" onclick="resolveDispute('${esc(d.id)}')">裁定</button>`:'-'}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">暂无争议。验收不通过时系统会自动开单。</div>'}
    </div>`;
}
async function resolveDispute(id){
  const v = await askForm('裁定争议',
    '裁定会写进凭证链，链上不可改；退款由结算层按份额追回。',
    [{key:'ruling', label:'裁定', type:'select', value:'uphold_reject',
      options:[{v:'uphold_reject',t:'维持打回（不付款）'},
               {v:'overturn_pay',t:'改判应付（全额付）'},
               {v:'partial',t:'部分退（按额退）'}]},
     {key:'refund', label:'退款额（积分 · 选"部分退"时才生效）', value:'1'},
     {key:'arbitrator', label:'仲裁员署名', value:'arb-manual', required:true}]);
  if(!v) return;
  const refund = v.ruling==='uphold_reject' ? 0 : (parseInt(v.refund,10)||0);
  try{
    await api(`/v1/arbitration/disputes/${id}/resolve`,{method:'POST',
      body:JSON.stringify({ruling:v.ruling, arbitrator:v.arbitrator.trim(),
                           refund_points:refund, resolution:'管理台人工裁定'})});
  }catch(e){ return alert('裁定失败: '+e.message); }
  loadAll();
}

async function renderConsensus(){
  const eps = await api('/v1/consensus/epochs?limit=30');
  const cv = await api('/v1/consensus/verify');
  document.getElementById('consensus').innerHTML = `
    <div class="grid">
      <div class="card"><h4>epoch 链</h4><div class="v">${cv.ok?'<span class="badge b-ok">完整</span>':'<span class="badge b-bad">异常</span>'}</div>
        <div class="s">${esc(cv.message)}</div></div>
      <div class="card"><h4>三把钥匙</h4><div class="v" style="font-size:14px">账本 · 见证≥2/3 · 资金锚</div>
        <div class="s">缺任何一把都不定案，宁可停摆</div></div>
    </div>
    <div class="row">
      <button onclick="sealEpoch()">封一个批次</button>
      <span class="muted">封口 → 见证签名 → 资金锚 → 定案；锚定后自动向 P2P 网络广播 ANCHOR</span>
    </div>
    <div class="sec"><h3>批次（epoch）</h3>
    ${eps.length?`<table><thead><tr><th>#</th><th>区间(rowid)</th><th>条数</th><th>Merkle 根</th><th>托管锚</th><th>状态</th><th>操作</th></tr></thead><tbody>
      ${eps.map(e=>`<tr><td class="mono">${e.seq}</td><td class="mono">${e.from_rowid}–${e.to_rowid}</td><td>${e.entry_count}</td>
        <td class="mono muted">${e.merkle_root.slice(0,18)}…</td><td class="mono">${e.escrow_balance_fen}分</td>
        <td><span class="badge ${e.state==='ANCHORED'?'b-ok':(e.state==='SEALED'?'b-warn':'b-info')}">${e.state}</span></td>
        <td>${e.state==='SEALED'?`<button class="ghost" onclick="advanceEpoch('${esc(e.epoch_id)}')">推进 →</button>`:'-'}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">还没有批次。攒够账目后点「封一个批次」。</div>'}
    </div>`;
}
async function sealEpoch(){
  const r = await api('/v1/consensus/epochs/seal',{method:'POST',body:JSON.stringify({threshold:1})});
  if(!r.sealed) alert('账目增量不足：'+r.why); loadAll();
}
async function advanceEpoch(id){
  await api(`/v1/consensus/epochs/${id}/witness`,{method:'POST',body:JSON.stringify({all:true})});
  await api(`/v1/consensus/epochs/${id}/anchor`,{method:'POST'});
  const r = await api(`/v1/consensus/epochs/${id}/finalize`,{method:'POST'});
  alert(r.passed? '✅ 定案：三把钥匙齐全，已向网络广播' : '⛔ 未通过：'+(r.why||'')+' / '+(r.anchor||''));
  loadAll();
}

  document.getElementById('ap2').innerHTML = `

      <div class="card"><h4>分工</h4><div class="v" style="font-size:14px">AP2 管买卖 · A2N 管结算</div>
        <div class="s">授权与问责走 AP2，验收与分账走 A2N，中间不碰钱</div></div>
      <div class="card"><h4>三把扩展</h4><div class="v" style="font-size:14px">预算冻结 / 结算凭证 / 问责材料</div>

budget = BudgetTranslator.from_intent(intent, skill="ocr-pro")   # 冻结，不是承诺

async function ap2Receipt(){
  const task = document.getElementById('ap2_task').value.trim();
  if(!task) return alert('先填任务 ID');
  try{
    const r = await api('/v1/ap2/receipt',{method:'POST',body:JSON.stringify({task_id:task})});
    document.getElementById('ap2_out').innerHTML =
      `<pre class="mono" style="background:#f6f7f9;padding:12px;border-radius:10px;overflow:auto">${esc(JSON.stringify(r,null,2))}</pre>`;
  }catch(e){ alert('生成失败: '+e.message); }
}
