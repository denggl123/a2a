<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2N 管理台</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1c1f23; --muted:#6b7280;
    --blue:#185fa5; --blue-bg:#e6f1fb; --green:#0f6e56; --green-bg:#e1f5ee;
    --amber:#854f0b; --amber-bg:#faeeda; --red:#a32d2d; --red-bg:#fcebeb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
         display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .brand{font-size:16px;font-weight:600}
  .brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  .spacer{flex:1}
  input,select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);
       border-radius:8px;background:#fff;color:var(--ink)}
  button{cursor:pointer;background:var(--blue);border-color:var(--blue);color:#fff}
  button.ghost{background:#fff;color:var(--ink)}
  button:hover{opacity:.88}
  nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 24px}
  nav button{background:none;border:none;color:var(--muted);border-radius:0;
             padding:12px 14px;border-bottom:2px solid transparent}
  nav button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
  main{padding:20px 24px;max-width:1200px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500}
  .card .v{font-size:22px;font-weight:600}
  .card .s{font-size:12px;color:var(--muted);margin-top:4px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .b-ok{background:var(--green-bg);color:var(--green)}
  .b-bad{background:var(--red-bg);color:var(--red)}
  .b-warn{background:var(--amber-bg);color:var(--amber)}
  .b-info{background:var(--blue-bg);color:var(--blue)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
        border-radius:12px;overflow:hidden;font-size:13px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#fafbfc;color:var(--muted);font-weight:500;font-size:12px}
  tr:last-child td{border-bottom:none}
  .sec{margin-bottom:22px}
  .sec h3{margin:0 0 10px;font-size:14px;font-weight:600}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .muted{color:var(--muted)}
  .empty{padding:24px;text-align:center;color:var(--muted);background:#fff;
         border:1px dashed var(--line);border-radius:12px}
  .bar{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden;width:90px}
  .bar i{display:block;height:100%;background:var(--blue)}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <div class="brand">A2N 管理台<span>只发行情 · 只刻章 · 不碰钱</span></div>
  <div class="spacer"></div>
  <label class="muted">主体</label>
  <input id="principal" value="acct:alice" style="width:150px">
  <button class="ghost" onclick="loadAll()">刷新</button>
</header>
<nav>
  <button class="on" data-tab="overview" onclick="tab(this)">总览</button>
  <button data-tab="provided" onclick="tab(this)">我提供的</button>
  <button data-tab="managed" onclick="tab(this)">我管理的</button>
  <button data-tab="discover" onclick="tab(this)">发现</button>
  <button data-tab="testbed" onclick="tab(this)">调用测试</button>
  <button data-tab="bind" onclick="tab(this)">结算账户</button>
  <button data-tab="trade" onclick="tab(this)">账户与交易</button>
  <button data-tab="chain" onclick="tab(this)">账本与凭证</button>
  <button data-tab="money" onclick="tab(this)">资金流水</button>
  <button data-tab="arbitration" onclick="tab(this)">仲裁</button>
  <button data-tab="consensus" onclick="tab(this)">共识</button>
  <button data-tab="ap2" onclick="tab(this)">AP2</button>
</nav>
<main>
  <section id="overview" class="sec"></section>
  <section id="provided" class="sec hide"></section>
  <section id="managed" class="sec hide"></section>
  <section id="discover" class="sec hide"></section>
  <section id="testbed" class="sec hide"></section>
  <section id="bind" class="sec hide"></section>
  <section id="trade" class="sec hide"></section>
  <section id="chain" class="sec hide"></section>
  <section id="money" class="sec hide"></section>
  <section id="arbitration" class="sec hide"></section>
  <section id="consensus" class="sec hide"></section>
  <section id="ap2" class="sec hide"></section>
</main>

<script>
const P = () => document.getElementById('principal').value.trim() || 'acct:alice';
async function api(path, opts={}){
  opts.headers = Object.assign({'X-Principal': P(), 'Content-Type':'application/json'}, opts.headers||{});
  const r = await fetch(path, opts);
  if(!r.ok){ const t = await r.text(); throw new Error(t.slice(0,200)); }
  return r.json();
}
// 多源并行取数：单个端点 5xx 不拖垮整页 —— 失败的源以 fallback 顶上，
// 其余照常渲染（Promise.all 是一损俱损：一个端点挂掉整页空白）。
async function apiAll(specs){
  const rs = await Promise.allSettled(specs.map(s=>api(s.path, s.opts||{})));
  return rs.map((r,i)=>{
    if(r.status==='fulfilled') return r.value;
    const f = specs[i].fallback;
    return typeof f === 'function' ? f() : f;
  });
}
// esc 必须连引号一起转义：值进了 href/title/onclick 属性时，不转引号就能被
// 注入内容闭合属性、插入事件处理器（XSS）。
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 积分账本锚 CNY（1 积分 = 0.01 元）：积分展示固定用 ¥
const yuan = p => '¥' + (p/100).toFixed(2);
// 事实金额（任务/账单/凭证）带自己的币种 —— 不是所有钱都是"元"。
// 最小单位整数 + 币种 → 展示串；币种指数按媒介注册口径取（内置常用币种）。
const CUR_EXP = {CNY:2, USD:2, EUR:2, HKD:2, JPY:0, USDC:6};
const CUR_SYM = {CNY:'¥', USD:'$', EUR:'€', HKD:'HK$', JPY:'¥'};
function curMoney(minor, currency){
  const cur = String(currency||'CNY').toUpperCase();
  const e = (CUR_EXP[cur]!=null) ? CUR_EXP[cur] : 2;
  const n = (Number(minor==null?0:minor) / Math.pow(10, e)).toFixed(e);
  return (CUR_SYM[cur] ? CUR_SYM[cur]+n : n + ' ' + cur);
}

function tab(btn){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ['overview','provided','managed','discover','testbed','bind','trade','chain','money','arbitration','consensus','ap2'].forEach(t=>
    document.getElementById(t).classList.toggle('hide', t!==btn.dataset.tab));
  if(btn.dataset.tab!=='discover') _discAuto(false);   // 离开发现页即停自动刷新
  loadAll();
}

async function loadAll(){
  const t = document.querySelector('nav button.on').dataset.tab;
  try{
    if(t==='overview') await renderOverview();
    if(t==='provided') await renderProvided();
    if(t==='managed') await renderManaged();
    if(t==='discover') await renderDiscover();
    if(t==='testbed') await renderTestbed();
    if(t==='bind') await renderBind();
    if(t==='trade') await renderTrade();
    if(t==='chain') await renderChain();
    if(t==='money') await renderMoney();
    if(t==='arbitration') await renderArbitration();
    if(t==='consensus') await renderConsensus();
    if(t==='ap2') renderAp2();
  }catch(e){ alert('加载失败: '+e.message); }
}

async function renderOverview(){
  const d = await api('/v1/console/overview');
  const r = d.reconcile;
  document.getElementById('overview').innerHTML = `
    <div class="grid">
      <div class="card"><h4>对账状态</h4>
        <div class="v">${r.balanced?'<span class="badge b-ok">平衡</span>':'<span class="badge b-bad">差 '+r.diff+' 分</span>'}</div>
        <div class="s">积分总量 ${r.points_total} · 托管 ${r.escrow_balance_fen} 分</div></div>
      <div class="card"><h4>账本链</h4>
        <div class="v">${d.ledger_chain.ok?'<span class="badge b-ok">完整</span>':'<span class="badge b-bad">异常</span>'}</div>
        <div class="s">${esc(d.ledger_chain.message)}</div></div>
      <div class="card"><h4>凭证链</h4>
        <div class="v">${d.notary_chain.ok?'<span class="badge b-ok">完整</span>':'<span class="badge b-bad">异常</span>'}</div>
        <div class="s">${esc(d.notary_chain.message)}</div></div>
      <div class="card"><h4>我的积分</h4><div class="v">${d.points_balance}</div>
        <div class="s">${yuan(d.points_balance)} · 可提现</div></div>
    </div>
    <div class="grid">
      <div class="card"><h4>我提供的</h4><div class="v">${d.provided.agents}</div>
        <div class="s">完成任务 ${d.provided.tasks_done} · 累计收益 ${yuan(d.provided.earned_points)}</div></div>
      <div class="card"><h4>我管理的</h4><div class="v">${d.managed.tasks_settled}</div>
        <div class="s">完成的任务（含非积分模式）· 积分支出 ${yuan(d.managed.spent_points)}</div></div>
      <div class="card"><h4>我的市场列表</h4><div class="v">${d.managed.roster_size}</div>
        <div class="s">我选择长期合作的 agent</div></div>
      <div class="card"><h4>全网</h4><div class="v">${d.market.agents_total}</div>
        <div class="s">节点 ${d.market.agents_online} 在线 · 成功率 ${(d.market.success_rate*100).toFixed(1)}%</div></div>
    </div>
    <div class="row">
      <button onclick="quickDeposit()">模拟充值 ¥100</button>
      <button class="ghost" onclick="newAccount()">新建主体</button>
      <span class="muted">充值走持牌方回调 → 托管 +10000 分 → 网内增发 10000 积分</span>
    </div>
    <div class="sec"><h3>能力供给</h3>
      <table><thead><tr><th>能力</th><th>供给节点数</th></tr></thead><tbody>
      ${d.market.skill_supply.map(s=>`<tr><td class="mono">${esc(s.skill_id)}</td><td>${s.supply}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">暂无</td></tr>'}
      </tbody></table></div>`;
}

async function renderProvided(){
  const [list, accs] = await apiAll([
    {path:'/v1/console/provided', fallback:[]},
    {path:'/v1/party-accounts', fallback:[]},
  ]);
  const recv = accs.filter(a=>a.status==='ACTIVE' && a.direction!=='pay');
  document.getElementById('provided').innerHTML = `
    <div class="sec"><h3>收款设置</h3>
    <p class="muted">提供方收什么样的钱，由你自己声明：绑定收款账户（币种/媒介），
    再给每个技能按币种标价。两种标价方式并存：v1 price_hint（CNY 分/次）与
    v2 价目表（多币种 × 多维度 × per）——平台只算不定价，改价随时生效，
    已成交的快照不受影响。</p>
    ${recv.length?`<table><thead><tr><th>收款账户</th><th>备注</th><th>币种/媒介</th><th>地址</th></tr></thead><tbody>
      ${recv.map(a=>`<tr><td class="mono">${esc(a.account_id)}</td><td>${esc(a.label)}</td>
        <td><span class="badge b-info">${esc(a.currency||'CNY')}</span> <span class="badge b-warn">${esc(a.medium||'-')}</span></td>
        <td class="mono muted">${esc(a.address||a.ref||'-')}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">还没有收款账户。去「资金流水」页建一个（direction 选仅收款）。</div>'}
    </div>
    <div class="row" style="margin-top:10px">
      <h3 style="margin:0">我提供的 Agent / 节点</h3>
      <button onclick="openShelf()">+ 上架新 Agent</button>
      <span class="muted">像维护商品一样填表单；或粘贴一份 card JSON 一键解析</span>
    </div>
    <div id="shelf_box"></div>
    ${list.length?`<table><thead><tr><th>名称</th><th>状态</th><th>连接</th><th>KYA</th><th>信誉</th>
      <th>能力</th><th>计量（调用/时长/token）</th><th>价目</th><th>收益</th><th>操作</th></tr></thead><tbody>
      ${list.map(a=>`<tr>
        <td><div>${esc(a.name||a.agent_id)}</div><div class="mono muted">${esc(a.agent_id)}</div>
          ${agentDesc(a)?`<div class="muted" style="font-size:11px" title="${esc(agentDesc(a))}">${esc(agentDesc(a)).slice(0,46)}${agentDesc(a).length>46?'…':''}</div>`:''}</td>
        <td><span class="badge ${a.status==='ACTIVE'?'b-ok':(a.status==='PROBATION'?'b-warn':'b-info')}">${a.status}</span></td>
        <td><span class="badge ${a.connection_info&&a.connection_info.reachable?'b-ok':'b-bad'}">${a.connection_info?a.connection_info.mode+(a.connection_info.reachable?'·通':'·断'):'-'}</span>
          <div class="muted" style="font-size:11px">${esc(a.connection_info?a.connection_info.nat:'')}${a.connection_info&&a.connection_info.peer_ip?' · '+esc(a.connection_info.peer_ip):''}</div></td>
        <td>${a.kya_grade}</td>
        <td><div class="bar"><i style="width:${(a.reputation*100).toFixed(0)}%"></i></div>${(a.reputation*100).toFixed(0)}</td>
        <td class="mono">${agentSkills(a)}</td>
        <td>${a.usage.calls} 次 / ${a.usage.avg_ms}ms / ${a.usage.tokens} tok</td>
        <td>${priceSummary(a.card_json)}</td>
        <td>${yuan(a.earned)}</td>
        <td><button class="ghost" onclick="openShelf('${esc(a.agent_id)}')">编辑</button>
            <button class="ghost" onclick="editPriceBook('${esc(a.agent_id)}')">价目表</button></td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">还没有提供任何 agent。点「上架新 Agent」像填商品一样创建一个。</div>'}
    <div id="price_editor"></div>`;
}

function priceSummary(cardJson){
  // 价目摘要：v2 多币种优先展示；没有则回退 v1 提示价
  try{
    const card = JSON.parse(cardJson||'{}');
    const ext = card['x-a2n'] || {};
    const book = ext.price_book || card.price_book;
    if(book && Object.keys(book).length){
      return Object.entries(book).map(([skill,byCur])=>
        `<div class="mono" style="font-size:11px">${esc(skill)}: ${Object.keys(byCur).join('/')}</div>`).join('');
    }
    const hint = ext.price_hint || card.price_hint || {};
    const first = Object.entries(hint)[0];
    return first ? `<span class="mono" style="font-size:11px">v1 ${esc(first[0])}=${esc(first[1].amount)}分/次</span>` : '<span class="muted">免费</span>';
  }catch(e){ return '-'; }
}

/* ---------- Agent 上架表单（淘宝商品式） ---------- */
let _shelfAgentId = null;   // null=新上架；否则编辑已有 agent

function agentDesc(a){
  try{ return (JSON.parse(a.card_json||'{}').description) || ''; }catch(e){ return ''; }
}
function agentSkills(a){
  // 卡片缺 skills / JSON 损坏都不能让整页渲染炸掉 —— 空串兜底
  try{ return (JSON.parse(a.card_json||'{}').skills||[]).map(s=>s&&s.id).filter(Boolean).join(', '); }
  catch(e){ return ''; }
}
function shelfGenName(){
  return 'agent-' + Math.random().toString(16).slice(2,6);
}
function shelfGenId(){
  // 网络唯一标识：UUID v4（密码学级随机，全域唯一靠概率保证）
  return (crypto.randomUUID ? crypto.randomUUID()
    : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
}
function openShelf(agentId){
  _shelfAgentId = agentId || null;
  document.getElementById('shelf_box').innerHTML = `
  <div class="card" style="margin-bottom:14px">
    <h3 style="margin-top:0">${_shelfAgentId?'编辑 Agent（'+_shelfAgentId+'）':'上架新 Agent'}</h3>
    <div class="sec" style="margin-bottom:10px">
      <b style="font-size:12px;color:var(--muted)">从 JSON 导入（可选）</b>
      <textarea id="sh_import" rows="3" style="width:100%;font-family:ui-monospace,Consolas,monospace"
        placeholder='粘贴一份 agent card JSON（name/skills/x-a2n…），点「解析填充」；留空则直接手填'></textarea>
      <div class="row" style="margin-top:6px">
        <button class="ghost" onclick="shelfParse()">解析填充</button>
        <span class="muted">识别名称、描述与各字段填进下面的表单；描述缺失会按部署属地与技能自动生成</span>
      </div>
    </div>
    <b style="font-size:12px;color:var(--muted)">基础信息</b>
    <div class="row">
      <label class="muted">名称*</label>
      <input id="sh_name" style="width:180px" placeholder="如 ocr-pro（可读名，可重复）">
      <button class="ghost" onclick="document.getElementById('sh_name').value=shelfGenName()">随机名</button>
      <label class="muted">版本</label><input id="sh_version" value="1.0.0" style="width:80px">
      <label class="muted">对外地址</label>
      <input id="sh_url" value="http://localhost:9000/a2a" style="width:200px">
    </div>
    <div class="row">
      <label class="muted">唯一 ID*</label>
      <input id="sh_uid" style="width:280px;font-family:ui-monospace,Consolas,monospace;font-size:12px" spellcheck="false">
      <button class="ghost" onclick="document.getElementById('sh_uid').value=shelfGenId()">换一个</button>
      <span class="muted">UUID，整个 A2A 网络内唯一；注册背书后不可再改</span>
    </div>
    <div class="row" style="align-items:flex-start">
      <label class="muted" style="margin-top:6px">描述</label>
      <textarea id="sh_desc" rows="2" style="flex:1" placeholder="这个 Agent 能做什么、适合谁用（留空保存时自动生成）"></textarea>
      <button class="ghost" onclick="shelfAutoDesc()">自动生成描述</button>
    </div>
    <b style="font-size:12px;color:var(--muted)">技能（至少一条）</b>
    <div id="sh_skills"></div>
    <div class="row"><button class="ghost" onclick="shelfAddSkill()">+ 加一条技能</button></div>
    <b style="font-size:12px;color:var(--muted)">服务与部署</b>
    <div class="row">
      <label class="muted">部署属地</label><input id="sh_region" value="cn-east-2" style="width:110px" title="数据驻留地：合规与就近调用用；硬件细节是节点的私事，不进网络事实">
      <label class="muted">最大延迟（SLA 声明）</label><input id="sh_lat" value="3000" type="number" style="width:90px">ms
      <span class="muted" style="font-size:11px">GPU/显存等实现细节不再收集 —— 能力是封装好的黑盒</span>
    </div>
    <b style="font-size:12px;color:var(--muted)">结算方式（勾了才有人能付钱调你）</b>
    <div class="row">
      <label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="sh_peer" checked>对等账户（双边记账）</label>
      <label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="sh_direct">直付，渠道</label>
      <input id="sh_channel" placeholder="alipay" style="width:110px" disabled>
      <label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="sh_x402">x402 微支付</label>
    </div>
    <b style="font-size:12px;color:var(--muted)">计量维度（可计费的才会进账单）</b>
    <div class="row" id="sh_dims"></div>
    <b style="font-size:12px;color:var(--muted)">基础价目（多币种/按token细价，保存后点列表里「价目表」继续编辑）</b>
    <div class="row">
      <select id="sh_price_cur"><option value="">免费（不标价）</option><option value="CNY">CNY（分）</option><option value="USDC">USDC（10⁻⁶）</option></select>
      <label class="muted">每次单价</label><input id="sh_price" type="number" value="3" style="width:90px">
      <span class="muted">价目表随时可改；已成交的快照不受影响</span>
    </div>
    <div class="row" style="margin-top:8px">
      <button onclick="shelfSave()">${_shelfAgentId?'保存修改':'保存上架'}</button>

function shelfAutoDesc(){
  const skills = [...document.querySelectorAll('#sh_skills .skill_row')]
    .map(r=>({id:r.querySelector('.sk_id').value.trim(), name:r.querySelector('.sk_name').value.trim()}))
    .filter(s=>s.id);
  if(!skills.length) return;
  const region = document.getElementById('sh_region').value.trim();
  const names = skills.map(s=>s.name||s.id).join('、');
  document.getElementById('sh_desc').value =
    `提供${names}${skills.length>1?'等':'（'+skills[0].id+'）'}服务` +
    (region?` · 部署于 ${region}`:'') +
    '。按实际计量结算，支持按币种标价；验收通过才记账。';
}
function shelfBuildCard(){
  const skills = [...document.querySelectorAll('#sh_skills .skill_row')]
    .map(r=>({id:r.querySelector('.sk_id').value.trim(),
              name:r.querySelector('.sk_name').value.trim() || r.querySelector('.sk_id').value.trim(),
              tags:r.querySelector('.sk_tags').value.split(/[,，\s]+/).filter(Boolean),
              inputModes:["application/json"]}))
    .filter(s=>s.id);
  if(!skills.length) throw new Error('至少填一条技能');
  let uid = document.getElementById('sh_uid').value.trim();
  if(!uid){ uid = shelfGenId(); document.getElementById('sh_uid').value = uid; }
  const name = document.getElementById('sh_name').value.trim() || shelfGenName();
  document.getElementById('sh_name').value = name;
  let desc = document.getElementById('sh_desc').value.trim();
  if(!desc) shelfAutoDesc();
  desc = document.getElementById('sh_desc').value.trim();
  const accepts = [];
  if(document.getElementById('sh_peer').checked) accepts.push('peer_account');
  if(document.getElementById('sh_direct').checked){
    const ch = document.getElementById('sh_channel').value.trim().toLowerCase();
    accepts.push(ch ? 'direct_pay:'+ch : 'direct_pay');
  }
  if(document.getElementById('sh_x402').checked) accepts.push('x402');
  const dims = [...document.querySelectorAll('.sh_dim:checked')].map(cb=>cb.value);
  const card = {
    name, description: desc,
    version: document.getElementById('sh_version').value.trim() || '1.0.0',
    url: document.getElementById('sh_url').value.trim() || 'http://localhost:9000/a2a',
    skills,
    "x-a2n": {
      uid,
      deployment: {region: document.getElementById('sh_region').value.trim() || null},
      sla: {max_latency_ms: parseInt(document.getElementById('sh_lat').value,10)||null},
      metering: {dimensions: dims.map(k=>({key:k, unit:k, verifiable:k!=='gpu_seconds'}))},
    },
  };
  if(accepts.length) card.accepts = accepts;
  const cur = document.getElementById('sh_price_cur').value;
  const price = parseInt(document.getElementById('sh_price').value,10)||0;
  if(cur && price>0 && skills.length){
    card['x-a2n'].price_book = {[skills[0].id]: {[cur]:
      {dimensions:[{key:'call_count', amount:price, per:1}]}}};
  }
  return card;
}
async function shelfSave(){
  let card;

  try{

    }
  }catch(e){ return alert('保存失败: '+e.message); }

  document.getElementById('shelf_box').innerHTML = '';
  loadAll();
}

const _disc = { agents:[], q:'', status:'all', limit:'20', custom:'',
                auto:false, sec:30, timer:null, ts:null, err:'' };

function _discCard(a){ try{ return JSON.parse(a.card_json||'{}'); }catch(e){ return {}; } }

function _discFiltered(){
  let list = _disc.agents;
  if(_disc.status!=='all') list = list.filter(a=>a.status===_disc.status);
  const q = _disc.q.trim().toLowerCase();
  if(q) list = list.filter(a=>{
    const c = _discCard(a);
    return [a.name, a.agent_id, a.uid, c.description, (c.skills||[]).map(s=>s.id).join(' ')]
      .join(' ').toLowerCase().includes(q);
  });
  let lim = list.length;
  if(_disc.limit==='custom'){ const n=parseInt(_disc.custom,10); lim = n>0?Math.min(n,list.length):list.length; }
  else if(_disc.limit!=='all'){ lim = Math.min(parseInt(_disc.limit,10)||20, list.length); }
  return { shown:list.slice(0,lim), total:list.length };
}

async function _discFetch(manual){
  try{
    _disc.agents = await api('/v1/registry/agents', {headers:{'X-Principal':''}});
    _disc.ts = new Date(); _disc.err = '';
  }catch(e){
    if(manual){ alert('加载失败: '+e.message); return; }

/* ---------- 调用测试台：直连 + 使用端聚合（配置存浏览器，平台零感知） ----------
   聚合策略与 SDK Aggregator 同构：round_robin / weighted(SWRR) + 冷却退避 + 半开。
   两个模式都走真实链路：取凭据 → 平台中继 → 节点；耗时为端到端实测。 */
let _tb = { agents: [], trail: [],
            cfg: JSON.parse(localStorage.getItem('a2n_agg_cfg') || 'null')
                 || {strategy:'weighted', cooldown_ms:30000, candidates:[]} };

function _tbSave(){ localStorage.setItem('a2n_agg_cfg', JSON.stringify(_tb.cfg)); }

async function relayCall(agentId, path, payload){
  // 与 SDK call_agent 同一条链：先取凭据（配对前提），再打平台中继入口
  const d = await api('/v1/transport/call-token',
                      {method:'POST', body: JSON.stringify({agent_id: agentId})});
  const sub = String(path||'').replace(/^\/+/, '');
  return api('/v1/relay/' + agentId + (sub ? '/' + sub : ''),
             {method:'POST', body: JSON.stringify(payload || {}),
              headers:{'X-A2N-Call': d.token}});
}

function _tbReward(c, ms){ c.ok=(c.ok||0)+1; c.streak=0; c.rtt=[ms, ...(c.rtt||[])].slice(0,20); }
function _tbPenalize(c){
  c.fail=(c.fail||0)+1; c.streak=(c.streak||0)+1;
  c.cool_until = Date.now() + (_tb.cfg.cooldown_ms||30000) * Math.min(c.streak, 5);
}

function _tbOrder(){
  // 与 SDK 同逻辑：冷却过滤在先；全员冷却时半开探测冷却最早到期的
  const now = Date.now();
  let alive = _tb.cfg.candidates.filter(c=>(c.cool_until||0) <= now);
  if(!alive.length)
    alive = [..._tb.cfg.candidates].sort((a,b)=>(a.cool_until||0)-(b.cool_until||0)).slice(0,1);
  if(_tb.cfg.strategy === 'round_robin'){
    _tb.state ??= {}; _tb.state.rr = (_tb.state.rr ?? -1) + 1;
    const n = alive.length;
    return alive.map((_,i)=>alive[(_tb.state.rr + i) % n]);
  }
  const st = _tb.state ??= {}; st.swrr ??= {};
  const total = alive.reduce((s,c)=>s+(c.weight||1), 0);
  alive.forEach(c=>st.swrr[c.agent_id]=(st.swrr[c.agent_id]||0)+(c.weight||1));
  const pick = alive.reduce((a,b)=>st.swrr[a.agent_id] >= st.swrr[b.agent_id] ? a : b);
  st.swrr[pick.agent_id] -= total;
  return [pick, ...alive.filter(c=>c!==pick).sort((a,b)=>st.swrr[b.agent_id]-st.swrr[a.agent_id])];
}

function _tbPayload(id){
  const raw = document.getElementById(id).value.trim();
  if(!raw) return {};

  if(typeof v !== 'object' || v === null || Array.isArray(v)) throw new Error('payload 必须是 JSON 对象');
  return v;
}

async function _tbDirectCall(){
  const agent = document.getElementById('tb_d_agent').value.trim();
  const path = document.getElementById('tb_d_path').value.trim();
  if(!agent){ alert('填 agent_id'); return; }
  let payload; try{ payload = _tbPayload('tb_d_payload'); }
  catch(e){ alert('payload 错误: '+e.message); return; }
  const t0 = performance.now();
  try{
    const r = await relayCall(agent, path, payload);
    _tbOut('tb_direct_out', true, Math.round(performance.now()-t0), JSON.stringify(r, null, 2));
  }catch(e){
    _tbOut('tb_direct_out', false, Math.round(performance.now()-t0), e.message);
  }
}

function _tbTrailRender(trail, finalOut, allFail){
  document.getElementById('tb_trail').innerHTML =
    `<table><thead><tr><th>#</th><th>候选</th><th>结果</th><th>耗时</th><th>说明</th></tr></thead><tbody>

      <td>${t.ok?'<span class="badge b-ok">成功</span>':'<span class="badge b-bad">失败</span>'}</td>
      <td class="mono">${t.ms} ms</td>
      <td class="muted" style="max-width:420px;overflow:hidden;text-overflow:ellipsis">${esc(t.err||'')}</td></tr>`).join('')}
    </tbody></table>
    ${finalOut!==undefined&&finalOut!==null?`<div class="row" style="margin-top:8px"><span class="badge b-ok">最终结果</span></div>
     <pre class="mono" style="background:#f6f7f9;padding:12px;border-radius:10px;overflow:auto">${esc(JSON.stringify(finalOut, null, 2))}</pre>`:''}
    ${allFail?`<div class="row" style="margin-top:8px"><span class="badge b-bad">全部候选失败</span></div>`:''}`;
}

async function _tbAggCall(){
  const skill = document.getElementById('tb_a_skill').value.trim();
  if(!skill){ alert('填 skill / 路径'); return; }
  if(!_tb.cfg.candidates.length){ alert('先添加候选'); return; }
  let payload; try{ payload = _tbPayload('tb_a_payload'); }
  catch(e){ alert('payload 错误: '+e.message); return; }
  const trail = []; let out;
  for(const c of _tbOrder()){
    const t0 = performance.now();
    try{
      out = await relayCall(c.agent_id, skill, payload);
      const ms = Math.round(performance.now()-t0);
      _tbReward(c, ms);
      trail.push({agent_id: c.agent_id, ok: true, ms});
      _tbTrailRender(trail, out); _tbRenderCands(); _tbSave();
      return;
    }catch(e){
      const ms = Math.round(performance.now()-t0);
      _tbPenalize(c);
      trail.push({agent_id: c.agent_id, ok: false, ms, err: String(e.message).slice(0,140)});
      _tbTrailRender(trail); _tbRenderCands();
    }
  }
  _tbSave();
  _tbTrailRender(trail, null, '全部候选失败');
}

async function bindSubmit(ch){
  const g = _guides.find(x=>x.channel===ch);
  const fields = {};
  (g.fields||[]).forEach(f=>{
    const el = document.getElementById('bf_'+f.key);
    if(el && el.value.trim()) fields[f.key] = el.value.trim();
  });
  try{
    await api('/v1/pay-methods',{method:'POST',body:JSON.stringify({channel:ch, fields:fields})});
  }catch(e){ 
    const msg = document.getElementById('bind_msg');
    if(msg){ msg.innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
    return;
  }
  const msg = document.getElementById('bind_msg');
  if(msg) msg.innerHTML = `<span style="color:var(--green);font-weight:600">✓ 已绑定，调用时自动结算</span>`;
  setTimeout(renderBind, 900);
}

async function newPartyAccount(){

      label, ref:ref||null,
      currency: document.getElementById('pa_cur').value,
      direction: document.getElementById('pa_dir').value,
    })});
  }catch(e){ return alert('建账户失败: '+e.message); }

}
async function closePayMethod(id){
  try{ await api('/v1/pay-methods/'+id+'/close',{method:'POST'}); }catch(e){ return alert('注销失败: '+e.message); }
  loadAll();
}
async function peerAct(link, act){
  await api('/v1/peers/'+link+'/'+act,{method:'POST'}); loadAll();
}
async function openDeal(link){
  const skill = prompt('做什么（skill id）？','ocr-pro'); if(!skill) return;
  try{ await api('/v1/deals',{method:'POST',body:JSON.stringify({link_id:link,skill})}); }
  catch(e){ return alert('达成失败: '+e.message); }
  loadAll();
}
async function reportDeal(id){
  const party = prompt('哪一方上报？','provider'); if(!party) return;
  const raw = prompt('计量维度 JSON','{"call_count":1}'); if(raw===null) return;
  let dims = {};
  try{ dims = raw.trim()?JSON.parse(raw):{}; }catch(e){ return alert('JSON 解析失败'); }
  try{ await api('/v1/deals/'+id+'/report',{method:'POST',body:JSON.stringify({party,dims})}); }
  catch(e){ return alert('上报失败: '+e.message); }
  loadAll();
}
async function reconDeal(id){
  try{ const d = await api('/v1/deals/'+id+'/reconcile',{method:'POST'});
    alert(d.recon&&d.recon.matched? '对账一致：'+d.recon.amount_fen+' 分' : '双方有分歧，已转争议（差 '+((d.recon||{}).delta_fen||0)+' 分）');
  }catch(e){ alert('对账失败: '+e.message); }
  loadAll();
}
async function issueStatement(link){
  const period = prompt('账期（YYYY-MM）', new Date().toISOString().slice(0,7));
  if(!period) return;
  try{ const s = await api('/v1/statements',{method:'POST',body:JSON.stringify({link_id:link,period})});
    alert('已出账：'+s.deal_count+' 笔，共 '+(s.total_fen/100).toFixed(2)+' 元');
  }catch(e){ alert('出账失败: '+e.message); }
  loadAll();
}

        <td class="mono">${d.ruling?esc(d.ruling)+(d.refund_fen?' · 退'+d.refund_fen:''):'-'}<div class="muted">${esc(d.arbitrator||'')}</div></td>
        <td>${d.state==='OPEN'?`<button class="ghost" onclick="resolveDispute('${esc(d.id)}')">裁定</button>`:'-'}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">暂无争议。验收不通过时系统会自动开单。</div>'}
    </div>`;
}
async function resolveDispute(id){
  const ruling = prompt('裁定类型：uphold_reject（维持打回）/ overturn_pay（改判应付）/ partial（部分退）','uphold_reject');
  if(!ruling) return;
  let refund = 0;
  if(ruling!=='uphold_reject') refund = parseInt(prompt('退款额（积分）','1'),10)||0;
  const arbitrator = prompt('仲裁员署名','arb-manual');
  await api(`/v1/arbitration/disputes/${id}/resolve`,{method:'POST',
    body:JSON.stringify({ruling,arbitrator,refund_points:refund,resolution:'管理台人工裁定'})});
  loadAll();
}

async function renderConsensus(){
  const eps = await api('/v1/consensus/epochs?limit=30');
  const cv = await api('/v1/consensus/verify');
  document.getElementById('consensus').innerHTML = `
    <div class="grid">
      <div class="card"><h4>epoch 链</h4><div class="v">${cv.ok?'<span class="badge b-ok">完整</span>':'<span class="badge b-bad">异常</span>'}</div>
        <div class="s">${esc(cv.message)}</div></div>
      <div class="card"><h4>三把钥匙</h4><div class="v" style="font-size:14px">账本 · 见证≥2/3 · 资金锚</div>
        <div class="s">缺任何一把都不定案，宁可停摆</div></div>
    </div>
    <div class="row">
      <button onclick="sealEpoch()">封一个批次</button>
      <span class="muted">封口 → 见证签名 → 资金锚 → 定案；锚定后自动向 P2P 网络广播 ANCHOR</span>
    </div>
    <div class="sec"><h3>批次（epoch）</h3>
    ${eps.length?`<table><thead><tr><th>#</th><th>区间(rowid)</th><th>条数</th><th>Merkle 根</th><th>托管锚</th><th>状态</th><th>操作</th></tr></thead><tbody>
      ${eps.map(e=>`<tr><td class="mono">${e.seq}</td><td class="mono">${e.from_rowid}–${e.to_rowid}</td><td>${e.entry_count}</td>
        <td class="mono muted">${e.merkle_root.slice(0,18)}…</td><td class="mono">${e.escrow_balance_fen}分</td>
        <td><span class="badge ${e.state==='ANCHORED'?'b-ok':(e.state==='SEALED'?'b-warn':'b-info')}">${e.state}</span></td>
        <td>${e.state==='SEALED'?`<button class="ghost" onclick="advanceEpoch('${esc(e.epoch_id)}')">推进 →</button>`:'-'}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">还没有批次。攒够账目后点「封一个批次」。</div>'}
    </div>`;
}
async function sealEpoch(){
  const r = await api('/v1/consensus/epochs/seal',{method:'POST',body:JSON.stringify({threshold:1})});
  if(!r.sealed) alert('账目增量不足：'+r.why); loadAll();
}
async function advanceEpoch(id){
  await api(`/v1/consensus/epochs/${id}/witness`,{method:'POST',body:JSON.stringify({all:true})});
  await api(`/v1/consensus/epochs/${id}/anchor`,{method:'POST'});
  const r = await api(`/v1/consensus/epochs/${id}/finalize`,{method:'POST'});
  alert(r.passed? '✅ 定案：三把钥匙齐全，已向网络广播' : '⛔ 未通过：'+(r.why||'')+' / '+(r.anchor||''));
  loadAll();
}

function renderAp2(){
  document.getElementById('ap2').innerHTML = `
    <div class="grid">
      <div class="card"><h4>分工</h4><div class="v" style="font-size:14px">AP2 管买卖 · A2N 管结算</div>
        <div class="s">授权与问责走 AP2，验收与分账走 A2N，中间不碰钱</div></div>
      <div class="card"><h4>三把扩展</h4><div class="v" style="font-size:14px">预算冻结 / 结算凭证 / 问责材料</div>
        <div class="s">授权不落地成冻结就只是口头承诺</div></div>
    </div>
    <div class="sec"><h3>出结算凭证（回填 Payment Mandate）</h3>
      <div class="row">
        <input id="ap2_task" placeholder="任务 ID" style="width:240px">
        <button onclick="ap2Receipt()">生成凭证</button>
        <span class="muted">四件套：结果哈希 · 双向计量 · 分账明细 · 公证章+epoch</span>
      </div>
      <div id="ap2_out"></div>
    </div>
    <div class="sec"><h3>SDK 用法</h3>
      <pre class="mono" style="background:#f6f7f9;padding:12px;border-radius:10px;overflow:auto">intent = BudgetTranslator.to_intent("acct:alice", "ag:shopper", "shop", max_amount_fen=500)
budget = BudgetTranslator.from_intent(intent, skill="ocr-pro")   # 冻结，不是承诺
tasks.create(**budget 选择字段)                                   # A2N 冻结预算并执行
receipt = POST /v1/ap2/receipt  {"task_id": ...}                 # 结束后出凭证回填 AP2</pre>
    </div>`;
}
async function ap2Receipt(){
  const task = document.getElementById('ap2_task').value.trim();
  if(!task) return alert('先填任务 ID');
  try{
    const r = await api('/v1/ap2/receipt',{method:'POST',body:JSON.stringify({task_id:task})});
    document.getElementById('ap2_out').innerHTML =
      `<pre class="mono" style="background:#f6f7f9;padding:12px;border-radius:10px;overflow:auto">${esc(JSON.stringify(r,null,2))}</pre>`;
  }catch(e){ alert('生成失败: '+e.message); }
}

/* ---------- 操作 ---------- */
async function doSearch(){
  const skill = document.getElementById('q_skill').value.trim();
  const region = document.getElementById('q_region').value.trim();
  const peerOnly = document.getElementById('q_peer').checked;
  const lat = parseInt(document.getElementById('q_lat').value, 10);
  const tags = document.getElementById('q_tags').value.trim();
  let filt = {};
  if(region) filt.region = [region];
  if(peerOnly) filt.accepts = ['peer_account'];
  if(lat) filt.max_latency_ms = lat;
  if(tags) filt.tags = tags.split(/[,，\s]+/).filter(Boolean);
  const r = await api('/v1/discovery/query', {method:'POST', body:JSON.stringify({require:{skill},filter:filt,limit:20})});
  document.getElementById('search_result').innerHTML = r.length?`
    <table><thead><tr><th>名称</th><th>状态</th><th>信誉</th><th>地域</th><th>结算方式</th><th>操作</th></tr></thead><tbody>
    ${r.map(a=>`<tr><td><div>${esc(a.name)}</div><div class="mono muted">${esc(a.agent_id)}</div></td>
      <td>${a.status}</td><td>${(a.reputation*100).toFixed(0)}</td>
      <td class="mono">${esc((a.compute||{}).region||'-')}</td>
      <td>${(a.accepts||[]).includes('peer_account')?'<span class="badge b-ok">支持对等账户</span>':'<span class="badge b-warn">仅预付费</span>'}</td>
      <td>${(a.accepts||[]).includes('peer_account')?`<button onclick="peerPropose('${esc(a.agent_id)}')">用我的账户配对</button>`:''}
         <button class="ghost" onclick="rosterAdd('${esc(a.agent_id)}')">加入列表</button></td></tr>`).join('')}
    </tbody></table>`:'<div class="empty">没有匹配的节点</div>';
}
async function peerPropose(agentId){
  if(!_myAccounts.length){ alert('先到「账户与交易」页新建一个账户'); return; }
  const opts = _myAccounts.map((a,i)=>`${i+1}. ${a.label}  ${a.account_id}`).join('\n');
  const idx = prompt('用哪个账户发起配对？\n'+opts+'\n\n输入序号', '1');
  if(idx===null) return;
  const acc = _myAccounts[parseInt(idx,10)-1];
  if(!acc) return alert('序号无效');
  const t = prompt('条款 JSON（留空=默认：账期30天、不限额）\n例：{"unit_prices":{"call_count":3},"credit_limit_fen":50000}', '');
  let terms = null;
  if(t && t.trim()){ try{ terms = JSON.parse(t); }catch(e){ return alert('JSON 解析失败'); } }
  try{
    await api('/v1/peers',{method:'POST',body:JSON.stringify({account_id:acc.account_id,agent_id:agentId,terms,auto_accept:true})});
    alert('已建立对等账户，可以开始交易');
  }catch(e){ alert('配对失败: '+e.message); }
  loadAll();
}

}
