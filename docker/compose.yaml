name: a2n-nodes
x-node: &node
  image: a2n-node
  restart: unless-stopped
  networks: [nodes]
services:
  node-video:
    <<: *node
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: a2n-dir-video
    environment:
      A2N_PUBLIC_BASE: http://node-video:8788
      A2N_PUBLIC_NODES: http://node-finance:8788
      A2N_COORD_ALLOW_NETWORKS: 172.30.46.0/24
      A2N_STORAGE_KEY: ${A2N_STORAGE_KEY:?Set A2N_STORAGE_KEY in docker/.env}
    ports: ["127.0.0.1:8791:8788"]
    volumes: ["video-state:/app/state"]
  node-finance:
    <<: *node
    container_name: a2n-dir-finance
    environment:
      A2N_PUBLIC_BASE: http://node-finance:8788
      A2N_PUBLIC_NODES: http://node-play:8788
      A2N_COORD_ALLOW_NETWORKS: 172.30.46.0/24
      A2N_STORAGE_KEY: ${A2N_STORAGE_KEY:?Set A2N_STORAGE_KEY in docker/.env}
    ports: ["127.0.0.1:8792:8788"]
    volumes: ["finance-state:/app/state"]
  node-play:
    <<: *node
    container_name: a2n-dir-play
    environment:
      A2N_PUBLIC_BASE: http://node-play:8788
      A2N_COORD_ALLOW_NETWORKS: 172.30.46.0/24
      A2N_STORAGE_KEY: ${A2N_STORAGE_KEY:?Set A2N_STORAGE_KEY in docker/.env}
    ports: ["127.0.0.1:8793:8788"]
    volumes: ["play-state:/app/state"]
networks:
  nodes:
    ipam:
      config: [{subnet: 172.30.46.0/24}]
volumes:
  video-state:
    name: a2n-dir-video-studio
  finance-state:
    name: a2n-dir-finance-legal
  play-state:
    name: a2n-dir-play-ecom
